[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "sage-stubs"
version = "10.7.0"
description = "PEP 561 stub-only package for Sage 10.7 category/structure interfaces"
requires-python = ">=3.12"
readme = "README.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["sage-stubs*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["sage-src"]

[tool.ruff.lint]
# Syntax/undefined names/import hygiene plus strict annotation and stub rules.
select = ["E4", "E7", "E9", "F", "I", "ANN", "UP", "PYI", "RUF"]

[tool.ruff.lint.per-file-ignores]
"sage-stubs/rings/asymptotic/asymptotic_ring.pyi" = ["E743"]

[tool.mypy]
python_version = "3.12"
files = ["sage-stubs"]
strict = true
incremental = false
follow_imports = "normal"
show_error_codes = true
show_column_numbers = true
warn_unused_configs = true
disallow_any_expr = true
disallow_any_decorated = true
disallow_any_unimported = true
disallow_any_generics = true
disallow_subclassing_any = true
