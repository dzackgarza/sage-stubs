name: Reconcile Phase 06 T06.2 protocol objects

on:
  push:
    branches: [phase-completion-export]
    paths:
      - .github/workflows/export-phase-completion-workspace.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-phase-completion-workspace.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reconcile-task:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out T06.2 branch
        uses: actions/checkout@v4
        with:
          ref: phase-06-t06-2-free-algebras
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install analyzers
        run: python -m pip install --upgrade ruff mypy basedpyright

      - name: Parameterize protocols by returned objects
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          free = Path('sage-stubs/algebras/free_algebra.pyi')
          text = free.read_text()
          old = '''_GeneratorCoefficient = TypeVar(
              "_GeneratorCoefficient",
              bound=RingElement,
              covariant=True,
          )
          '''
          new = '''_GeneratorElement = TypeVar(
              "_GeneratorElement",
              covariant=True,
          )
          '''
          if old in text:
              text = text.replace(old, new)
              text = text.replace(
                  'class FreeAlgebraGeneratorFamily(Protocol[_GeneratorCoefficient]):',
                  'class FreeAlgebraGeneratorFamily(Protocol[_GeneratorElement]):',
              )
              text = text.replace(
                  'FreeAlgebraElement[_GeneratorCoefficient]',
                  '_GeneratorElement',
              )
              text = text.replace(
                  'FreeAlgebraGeneratorFamily[_Coefficient]',
                  'FreeAlgebraGeneratorFamily[FreeAlgebraElement[_Coefficient]]',
              )
          elif new not in text:
              raise SystemExit('free-algebra generator protocol no longer matches expected text')
          free.write_text(text)

          quotient = Path('sage-stubs/algebras/free_algebra_quotient.pyi')
          text = quotient.read_text()
          old = '''_AmbientCoefficient = TypeVar(
              "_AmbientCoefficient",
              bound=RingElement,
              covariant=True,
          )
          '''
          new = '''_AmbientAlgebra = TypeVar("_AmbientAlgebra", covariant=True)
          _AmbientParent = TypeVar("_AmbientParent", covariant=True)
          _AmbientElement = TypeVar("_AmbientElement", covariant=True)
          '''
          if old in text:
              text = text.replace(old, new)
              old_protocols = '''class AmbientQuotientParent(Protocol[_AmbientCoefficient]):
              def ambient_algebra(
                  self,
              ) -> FreeAlgebraQuotient[_AmbientCoefficient]: ...
          
          class AmbientQuotientAlgebraElement(Protocol[_AmbientCoefficient]):
              def parent(self) -> AmbientQuotientParent[_AmbientCoefficient]: ...
              def ambient_algebra_element(
                  self,
              ) -> FreeAlgebraQuotientElement[_AmbientCoefficient]: ...
          '''
              new_protocols = '''class AmbientQuotientParent(Protocol[_AmbientAlgebra]):
              def ambient_algebra(self) -> _AmbientAlgebra: ...
          
          class AmbientQuotientAlgebraElement(
              Protocol[_AmbientParent, _AmbientElement]
          ):
              def parent(self) -> _AmbientParent: ...
              def ambient_algebra_element(self) -> _AmbientElement: ...
          '''
              if old_protocols not in text:
                  raise SystemExit('quotient protocols no longer match expected text')
              text = text.replace(old_protocols, new_protocols)
              text = text.replace(
                  '    | AmbientQuotientAlgebraElement[_InputCoefficient]\n',
                  '''    | AmbientQuotientAlgebraElement[
                      AmbientQuotientParent[
                          FreeAlgebraQuotient[_InputCoefficient]
                      ],
                      FreeAlgebraQuotientElement[_InputCoefficient],
                  ]
          ''',
              )
          elif new not in text:
              raise SystemExit('quotient object protocols no longer match expected text')
          quotient.write_text(text)
          PY

          files=(
            sage-stubs/algebras/free_algebra.pyi
            sage-stubs/algebras/free_algebra_quotient.pyi
          )
          ruff check --fix --select I "${files[@]}"
          ruff format "${files[@]}"
          ruff check "${files[@]}"
          python scripts/check_stubs.py "${files[@]}"
          git diff --check

      - name: Commit and push protocol-object repair
        run: |
          set -euo pipefail
          git config user.name 'D. Zack Garza'
          git config user.email 'dzackgarza@gmail.com'
          git add \
            sage-stubs/algebras/free_algebra.pyi \
            sage-stubs/algebras/free_algebra_quotient.pyi
          if git diff --cached --quiet; then
            echo 'Protocol-object repair already present.'
          else
            git commit -m 'fix(stubs): parameterize free algebra protocols by objects'
            git push origin HEAD:phase-06-t06-2-free-algebras
          fi

      - name: Check task structure and formatting
        run: |
          set -euo pipefail
          files=(
            sage-stubs/algebras/free_algebra.pyi
            sage-stubs/algebras/free_algebra_element.pyi
            sage-stubs/algebras/free_algebra_quotient.pyi
            sage-stubs/algebras/free_algebra_quotient_element.pyi
            sage-stubs/algebras/free_zinbiel_algebra.pyi
            sage-stubs/algebras/letterplace/free_algebra_element_letterplace.pyi
            sage-stubs/algebras/letterplace/free_algebra_letterplace.pyi
            sage-stubs/algebras/letterplace/letterplace_ideal.pyi
          )
          ruff check "${files[@]}"
          ruff format --check "${files[@]}"
          python scripts/check_stubs.py "${files[@]}"
          git diff --check

      - name: Check task files with basedpyright
        run: |
          set -euo pipefail
          basedpyright --project pyrightconfig.json --outputjson > /tmp/basedpyright.json || true
          python - <<'PY'
          import json
          from pathlib import Path

          targets = {
              'sage-stubs/algebras/free_algebra.pyi',
              'sage-stubs/algebras/free_algebra_element.pyi',
              'sage-stubs/algebras/free_algebra_quotient.pyi',
              'sage-stubs/algebras/free_algebra_quotient_element.pyi',
              'sage-stubs/algebras/free_zinbiel_algebra.pyi',
              'sage-stubs/algebras/letterplace/free_algebra_element_letterplace.pyi',
              'sage-stubs/algebras/letterplace/free_algebra_letterplace.pyi',
              'sage-stubs/algebras/letterplace/letterplace_ideal.pyi',
          }
          report = json.loads(Path('/tmp/basedpyright.json').read_text())
          diagnostics = []
          for item in report.get('generalDiagnostics', []):
              path = item.get('file', '').replace('\\', '/')
              rel = next((target for target in targets if path.endswith('/' + target)), None)
              if rel is not None:
                  diagnostics.append((rel, item))
          print(f'T06.2 basedpyright diagnostics: {len(diagnostics)}')
          for rel, item in diagnostics:
              start = item.get('range', {}).get('start', {})
              print(
                  f"{rel}:{start.get('line', 0) + 1}:{start.get('character', 0) + 1}: "
                  f"{item.get('rule')}: {item.get('message')}"
              )
          if diagnostics:
              raise SystemExit(1)
          PY

      - name: Check task modules with mypy
        run: |
          set -euo pipefail
          mkdir -p /tmp/mypyroot
          ln -s "$PWD/sage-stubs" /tmp/mypyroot/sage
          MYPYPATH=/tmp/mypyroot python -m mypy \
            --strict \
            --no-incremental \
            --follow-imports=silent \
            --show-error-codes \
            -m sage.algebras.free_algebra \
            -m sage.algebras.free_algebra_element \
            -m sage.algebras.free_algebra_quotient \
            -m sage.algebras.free_algebra_quotient_element \
            -m sage.algebras.free_zinbiel_algebra \
            -m sage.algebras.letterplace.free_algebra_element_letterplace \
            -m sage.algebras.letterplace.free_algebra_letterplace \
            -m sage.algebras.letterplace.letterplace_ideal

      - name: Verify algebra source coverage
        run: python scripts/stub_coverage.py --subpackage algebras --missing
