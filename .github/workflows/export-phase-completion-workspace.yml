name: Finalize Phase 06 T06.1 formatting and orphan cleanup

on:
  push:
    branches: [phase-completion-export]
    paths:
      - .github/workflows/export-phase-completion-workspace.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-phase-completion-workspace.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out T06.1 branch
        uses: actions/checkout@v4
        with:
          ref: phase-06-t06-1-clifford-exterior
          fetch-depth: 0

      - name: Install formatter
        run: python -m pip install --upgrade ruff

      - name: Remove obsolete duplicate module and normalize imports
        run: |
          set -euo pipefail
          rm sage-stubs/algebras/exterior_algebra.pyi
          python - <<'PY'
          from pathlib import Path

          path = Path('sage-stubs/combinat/free_module.pyi')
          text = path.read_text()
          text = text.replace('from typing import TypeVar\n\n', '')
          path.write_text(text)
          PY

      - name: Format touched stubs
        run: |
          set -euo pipefail
          ruff format \
            sage-stubs/algebras/clifford_algebra.pyi \
            sage-stubs/algebras/clifford_algebra_element.pyi \
            sage-stubs/algebras/exterior_algebra_groebner.pyi \
            sage-stubs/combinat/free_module.pyi \
            sage-stubs/modules/module.pyi \
            sage-stubs/rings/noncommutative_ideals.pyi
          ruff check \
            sage-stubs/algebras/clifford_algebra.pyi \
            sage-stubs/algebras/clifford_algebra_element.pyi \
            sage-stubs/algebras/exterior_algebra_groebner.pyi \
            sage-stubs/combinat/free_module.pyi \
            sage-stubs/modules/module.pyi \
            sage-stubs/rings/noncommutative_ideals.pyi

      - name: Validate touched stubs
        run: |
          set -euo pipefail
          python scripts/check_stubs.py \
            sage-stubs/algebras/clifford_algebra.pyi \
            sage-stubs/algebras/clifford_algebra_element.pyi \
            sage-stubs/algebras/exterior_algebra_groebner.pyi \
            sage-stubs/combinat/free_module.pyi \
            sage-stubs/modules/module.pyi \
            sage-stubs/rings/noncommutative_ideals.pyi
          python scripts/check_guardrails.py
          git diff --check

      - name: Commit and push final task cleanup
        run: |
          set -euo pipefail
          git config user.name 'D. Zack Garza'
          git config user.email 'dzackgarza@gmail.com'
          git add \
            sage-stubs/algebras/clifford_algebra.pyi \
            sage-stubs/algebras/clifford_algebra_element.pyi \
            sage-stubs/algebras/exterior_algebra_groebner.pyi \
            sage-stubs/algebras/exterior_algebra.pyi \
            sage-stubs/combinat/free_module.pyi \
            sage-stubs/modules/module.pyi \
            sage-stubs/rings/noncommutative_ideals.pyi
          if git diff --cached --quiet; then
            echo 'No cleanup required.'
            exit 0
          fi
          git commit -m 'fix(stubs): finalize Clifford source parity'
          git push origin HEAD:phase-06-t06-1-clifford-exterior
