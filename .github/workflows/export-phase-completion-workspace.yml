name: Close Phase 06 T06.1 plan task

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/export-phase-completion-workspace.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  close-task:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out T06.1 branch
        uses: actions/checkout@v4
        with:
          ref: phase-06-t06-1-clifford-exterior
          fetch-depth: 0

      - name: Record completed task and advance frontier
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          phase = Path('.agents/phases/phase-06-algebras-core.md')
          text = phase.read_text()
          old = '| T06.1 | **Clifford & exterior** — `clifford_algebra`, `clifford_algebra_element`, `exterior_algebra_groebner`. | 3 | — | ⬜ Not Started | Existing stubs still require a complete source audit. |'
          new = '| T06.1 | **Clifford & exterior** — `clifford_algebra`, `clifford_algebra_element`, `exterior_algebra_groebner`. | 3 | — | ✅ Complete | Parent, element, differential, ideal, and Gröbner surfaces are source-grounded against the pinned Sage revision; frozen-bitset bases, coefficient rings, lifted morphisms, Hopf operations, homology codomains, involutions, scalar pairings, and term-order-dependent outputs are preserved. The obsolete duplicate `exterior_algebra` stub was removed. |'
          if old not in text:
              raise SystemExit('T06.1 task row no longer matches expected plan state')
          text = text.replace(old, new)
          anchor = '| #18 | T06.8, plus Phase 09 support | Finite graded-commutative algebra and weighted exponent vectors. |'
          addition = anchor + '\n| #27 | T06.1, plus shared module/ideal contracts | Clifford and exterior parents, elements, Lie differentials, ideals, Gröbner strategies, and the required coercion and noncommutative-ideal owner repairs. |'
          if anchor not in text:
              raise SystemExit('Phase 06 landed-commit table anchor is missing')
          text = text.replace(anchor, addition)
          phase.write_text(text)

          plan = Path('.agents/plan.md')
          text = plan.read_text()
          old = '''> **Latest completed workstream:** Phase 05 now covers the complete matrix and
          > module hierarchy, including exact and numerical matrix backends, free and
          > finitely generated modules, concrete vectors, filtered spaces, with-basis
          > constructions, and Ore modules.
          >
          > **Active first-level phase:** Phase 06 (associative and non-Lie algebras).
          > Its completed foundational tasks are the current dependency surface for the
          > remaining algebra workstreams.
          >
          > **Next valid work:** advance a named Phase 06 task. Phases 07, 08, 09, 12,
          > 14, 15, and 17 are now dependency-ready; Phase 13 remains additionally gated
          > by Phase 12, and Phases 10–11 remain gated by Phase 09.
          '''
          new = '''> **Latest completed workstream:** Phase 06 task T06.1 now covers the complete
          > Clifford/exterior parent, element, differential, ideal, and Gröbner surface,
          > including the shared coercion and noncommutative-ideal contracts required by
          > those algebras.
          >
          > **Active first-level phase:** Phase 06 (associative and non-Lie algebras).
          > T06.1 is complete; the remaining Phase 06 tasks retain their recorded partial
          > or not-started states.
          >
          > **Next valid work:** complete T06.2 (free algebras and quotients) or another
          > named Phase 06 task. Phases 07, 08, 09, 12, 14, 15, and 17 are dependency-ready;
          > Phase 13 remains additionally gated by Phase 12, and Phases 10–11 remain gated
          > by Phase 09.
          '''
          if old not in text:
              raise SystemExit('Master frontier no longer matches expected state')
          plan.write_text(text.replace(old, new))
          PY
          git diff --check

      - name: Commit and push task closure
        run: |
          set -euo pipefail
          git config user.name 'D. Zack Garza'
          git config user.email 'dzackgarza@gmail.com'
          git add .agents/phases/phase-06-algebras-core.md .agents/plan.md
          git commit -m 'docs(plan): complete Phase 06 Clifford task'
          git push origin HEAD:phase-06-t06-1-clifford-exterior
