name: Export phase-completion workspace

# Export the current Phase 05 completion branch with the pinned Sage source.
on:
  push:
    branches: [phase-completion-export]
    paths:
      - .github/workflows/export-phase-completion-workspace.yml
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out Phase 05 branch and pinned Sage source
        uses: actions/checkout@v4
        with:
          ref: phase-05-completion
          fetch-depth: 1
          submodules: recursive

      - name: Build source-and-stub workspace archive
        run: |
          set -euo pipefail
          tar -czf phase-05-completion-workspace.tar.gz \
            AGENTS.md \
            pyproject.toml \
            justfile \
            scripts \
            .agents \
            sage-stubs \
            sage-src/src/sage

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: phase-05-completion-workspace
          path: phase-05-completion-workspace.tar.gz
          retention-days: 1
          if-no-files-found: error
