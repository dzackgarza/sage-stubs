name: Apply ring-kernel refinement

on:
  push:
    branches: [main]
    paths:
      - scripts/refine_ring_kernel.py
      - scripts/check_ring_kernel.py
      - .github/workflows/apply-ring-kernel.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-ring-kernel-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and pinned Sage source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install focused validators
        run: python -m pip install --upgrade ruff mypy

      - name: Require the categorical kernel
        run: python scripts/check_category_kernel.py

      - name: Apply reviewed ring relationships
        run: python scripts/refine_ring_kernel.py

      - name: Normalize changed declarations
        run: |
          ruff format \
            sage-stubs/rings/ring.pyi \
            sage-stubs/rings/commutative_ring.pyi \
            sage-stubs/rings/integral_domain.pyi \
            sage-stubs/rings/principal_ideal_domain.pyi \
            sage-stubs/rings/field.pyi \
            sage-stubs/rings/morphism.pyi \
            sage-stubs/rings/homset.pyi \
            typing_tests/ring_kernel/parents_and_homomorphisms.py

      - name: Verify source-derived mathematical relationships
        run: |
          python -m py_compile \
            sage-stubs/rings/ring.pyi \
            sage-stubs/rings/commutative_ring.pyi \
            sage-stubs/rings/integral_domain.pyi \
            sage-stubs/rings/principal_ideal_domain.pyi \
            sage-stubs/rings/field.pyi \
            sage-stubs/rings/morphism.pyi \
            sage-stubs/rings/homset.pyi
          python scripts/check_ring_kernel.py

      - name: Check the consumer contract
        env:
          MYPYPATH: sage-stubs
        run: |
          python -m mypy \
            --strict \
            --no-incremental \
            --follow-imports=silent \
            --show-error-codes \
            typing_tests/ring_kernel/parents_and_homomorphisms.py

      - name: Commit the phase result
        run: |
          set -euo pipefail
          git add \
            sage-stubs/rings/ring.pyi \
            sage-stubs/rings/commutative_ring.pyi \
            sage-stubs/rings/integral_domain.pyi \
            sage-stubs/rings/principal_ideal_domain.pyi \
            sage-stubs/rings/field.pyi \
            sage-stubs/rings/morphism.pyi \
            sage-stubs/rings/homset.pyi \
            typing_tests/ring_kernel/parents_and_homomorphisms.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Ring kernel already has the reviewed relationships.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(types): preserve coefficient types through ring tower'
          git push origin HEAD:main
