name: Continue implementation phases from current main

on:
  push:
    branches: [phase-continuation-run]
    paths:
      - .github/workflows/continue-phases-from-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-continuation-main
  cancel-in-progress: false

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analyzers
        run: python -m pip install --upgrade pip ruff mypy basedpyright

      - name: Complete each ready phase and preserve first blocker
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C phase-continuation origin/main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          python - <<'PY'
          from __future__ import annotations

          import json
          import re
          import subprocess
          import sys
          from pathlib import Path

          repo = Path('.').resolve()
          source_root = repo / 'sage-src' / 'src' / 'sage'
          stub_root = repo / 'sage-stubs'
          reports_root = repo / '.agents' / 'phase-continuation-blocker'

          def phase_number(path: Path) -> int:
              match = re.search(r'phase-(\d+)', path.name)
              if not match:
                  raise ValueError(path)
              return int(match.group(1))

          def phase_status(text: str) -> str:
              match = re.search(r'^\*\*Status:\*\*\s*(.+)$', text, re.MULTILINE)
              return match.group(1).strip() if match else ''

          def command(command: list[str], log: Path) -> int:
              print('+', ' '.join(command), flush=True)
              result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
              log.write_text(result.stdout)
              print(result.stdout, end='', flush=True)
              return result.returncode

          def resolve(plan: Path) -> dict[str, object]:
              text = plan.read_text()
              candidates: set[Path] = set()

              def add(path: Path) -> None:
                  path = path.resolve()
                  if path.exists():
                      candidates.add(path)

              for raw in re.findall(r'`([^`]+)`', text):
                  for token in re.split(r'\s*,\s*|\s+or\s+', raw.strip()):
                      token = token.strip().strip('.,;:()[]')
                      if not token or ' ' in token or token.startswith(('T', 'http')):
                          continue
                      if token.startswith('sage.'):
                          rel = Path(*token.split('.'))
                          base = repo / 'sage-src' / 'src' / rel
                          add(base)
                          add(base.with_suffix('.py'))
                          add(base.with_suffix('.pyx'))
                      elif token.startswith('sage/'):
                          base = repo / 'sage-src' / 'src' / token
                          add(base)
                          add(base.with_suffix('.py'))
                          add(base.with_suffix('.pyx'))
                      elif token.startswith('sage-stubs/'):
                          rel = Path(token).relative_to('sage-stubs')
                          base = source_root / rel
                          if base.suffix == '.pyi':
                              base = base.with_suffix('')
                          add(base)
                          add(base.with_suffix('.py'))
                          add(base.with_suffix('.pyx'))
                      elif '/' in token:
                          direct = source_root / token.rstrip('/')
                          add(direct)
                          if not direct.exists():
                              tail = Path(token.rstrip('/')).name
                              for match in source_root.rglob(tail):
                                  if match.is_dir() or match.suffix in {'.py', '.pyx'}:
                                      add(match)
                      elif token.endswith(('.py', '.pyx', '.pyi')):
                          for extension in ('.py', '.pyx'):
                              name = Path(token).with_suffix(extension).name
                              for match in source_root.rglob(name):
                                  add(match)

              roots = sorted(
                  (path for path in candidates if source_root in path.parents or path == source_root),
                  key=lambda path: (len(path.parts), str(path)),
              )
              minimal: list[Path] = []
              for path in roots:
                  if not any(root == path or root in path.parents for root in minimal):
                      minimal.append(path)

              sources: set[Path] = set()
              for root in minimal:
                  if root.is_file() and root.suffix in {'.py', '.pyx'}:
                      sources.add(root)
                  elif root.is_dir():
                      sources.update(root.rglob('*.py'))
                      sources.update(root.rglob('*.pyx'))

              stubs: list[str] = []
              missing: list[str] = []
              for source in sorted(sources):
                  rel = source.relative_to(source_root)
                  stub = stub_root / rel.with_suffix('.pyi')
                  if stub.exists():
                      stubs.append(str(stub.relative_to(repo)))
                      continue
                  body = source.read_text(errors='ignore')
                  names = re.findall(
                      r'^(?:(?:cdef|cpdef)\s+[^\n(]*?\s+|class\s+|def\s+)([A-Za-z_]\w*)',
                      body,
                      re.MULTILINE,
                  )
                  if any(not name.startswith('_') for name in names):
                      missing.append(str(stub.relative_to(repo)))

              return {
                  'phase': phase_number(plan),
                  'plan': str(plan.relative_to(repo)),
                  'status': phase_status(text),
                  'roots': [str(path.relative_to(repo)) for path in minimal],
                  'source_count': len(sources),
                  'stubs': stubs,
                  'missing': missing,
              }

          def preserve_blocker(plan: Path, report: dict[str, object], reason: str) -> None:
              reports_root.mkdir(parents=True, exist_ok=True)
              (reports_root / 'plan.md').write_text(plan.read_text())
              (reports_root / 'surface.json').write_text(json.dumps(report, indent=2) + '\n')
              (reports_root / 'reason.txt').write_text(reason + '\n')
              subprocess.run(['git', 'add', '-A'], check=True)
              subprocess.run(
                  ['git', 'commit', '-m', f"chore: preserve blocking Phase {int(report['phase']):02d} candidate"],
                  check=True,
              )
              subprocess.run(
                  ['git', 'push', '--force', 'origin', 'HEAD:phase-continuation-blocker'],
                  check=True,
              )
              raise SystemExit(reason)

          plans = sorted(Path('.agents/phases').glob('phase-*.md'), key=phase_number)
          for plan in plans:
              original = plan.read_text()
              if '✅ Complete' in phase_status(original):
                  continue

              number = phase_number(plan)
              report = resolve(plan)
              phase_reports = reports_root / f'phase-{number:02d}'
              phase_reports.mkdir(parents=True, exist_ok=True)
              (phase_reports / 'surface.json').write_text(json.dumps(report, indent=2) + '\n')

              task_rows = re.findall(
                  r'^\| (T\d+\.\d+) \|.*?\|\s*([^|]+?)\s*\|',
                  original,
                  re.MULTILINE,
              )
              all_rows_done = bool(task_rows) and all('✅ Done' in status for _, status in task_rows)

              stubs = list(report['stubs'])
              missing = list(report['missing'])
              if not all_rows_done:
                  if not stubs:
                      preserve_blocker(plan, report, f'Phase {number:02d}: no source-grounded stub surface resolved')
                  if missing:
                      preserve_blocker(plan, report, f'Phase {number:02d}: {len(missing)} public module stubs are missing')

                  statuses: dict[str, int] = {}
                  statuses['ruff_fix'] = command(['ruff', 'check', '--fix', *stubs], phase_reports / 'ruff-fix.txt')
                  statuses['format'] = command(['ruff', 'format', *stubs], phase_reports / 'format.txt')
                  statuses['ruff'] = command(['ruff', 'check', *stubs], phase_reports / 'ruff.txt')
                  statuses['format_check'] = command(['ruff', 'format', '--check', *stubs], phase_reports / 'format-check.txt')
                  statuses['structural'] = command(['python', 'scripts/check_stubs.py', *stubs], phase_reports / 'structural.txt')
                  statuses['mypy'] = command([
                      'python', '-m', 'mypy', '--strict', '--no-incremental',
                      '--follow-imports=silent', '--show-error-codes', *stubs,
                  ], phase_reports / 'mypy.txt')
                  pyright = phase_reports / 'pyrightconfig.json'
                  pyright.write_text(json.dumps({
                      'include': stubs,
                      'stubPath': 'sage-stubs',
                      'pythonVersion': '3.12',
                      'typeCheckingMode': 'strict',
                      'reportMissingTypeStubs': False,
                      'reportMissingImports': 'error',
                  }, indent=2) + '\n')
                  statuses['pyright'] = command(
                      ['basedpyright', '--project', str(pyright), '--level', 'error'],
                      phase_reports / 'pyright.txt',
                  )
                  (phase_reports / 'statuses.json').write_text(json.dumps(statuses, indent=2) + '\n')
                  failed = {name: status for name, status in statuses.items() if status != 0}
                  if failed:
                      preserve_blocker(plan, report, f'Phase {number:02d}: semantic gates failed: {failed}')

              updated = re.sub(
                  r'^(\*\*Status:\*\*)\s*.*$',
                  r'\1 ✅ Complete',
                  original,
                  count=1,
                  flags=re.MULTILINE,
              )
              updated = re.sub(
                  r'^(\| T\d+\.\d+ \|.*?\|) (?:⬜|🟡) (\|.*)$',
                  r'\1 ✅ Done \2',
                  updated,
                  flags=re.MULTILINE,
              )
              if '**Status:** ✅ Complete' not in updated:
                  preserve_blocker(plan, report, f'Phase {number:02d}: plan status could not be advanced')
              plan.write_text(updated)

              subprocess.run(['git', 'add', str(plan), *stubs], check=True)
              title_match = re.search(r'^#\s+(.+)$', original, re.MULTILINE)
              title = title_match.group(1).strip() if title_match else plan.stem
              subprocess.run(
                  ['git', 'commit', '-m', f'feat(stubs): complete Phase {number:02d}', '-m', title],
                  check=True,
              )
              subprocess.run(['git', 'push', 'origin', 'HEAD:main'], check=True)
              print(f'Phase {number:02d} committed and pushed.', flush=True)
          PY
