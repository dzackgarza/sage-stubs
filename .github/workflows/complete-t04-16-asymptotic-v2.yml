name: Complete T04.16 asymptotic rings v2

on:
  push:
    branches: [t04-16-asymptotic-completion-v2]
    paths:
      - .github/workflows/complete-t04-16-asymptotic-v2.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase04-main-writes-v6
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate full seven-module task
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main origin/main
          python -m pip install --upgrade pip ruff
          target=sage-stubs/rings/asymptotic
          ruff format "$target"
          ruff check --fix "$target"
          ruff check "$target"
          ruff format --check "$target"
          python scripts/check_stubs.py $(find "$target" -name '*.pyi' -print)
          python scripts/audit_stub_quality.py --root "$target" --max-console 1000
          python - <<'PY'
          import ast
          from pathlib import Path

          modules = (
              'asymptotic_ring',
              'asymptotic_expansion_generators',
              'asymptotics_multivariate_generating_functions',
              'growth_group',
              'growth_group_cartesian',
              'term_monoid',
              'misc',
          )
          source_root = Path('sage-src/src/sage/rings/asymptotic')
          stub_root = Path('sage-stubs/rings/asymptotic')
          failures: list[str] = []

          def public_defs(tree: ast.Module) -> dict[str, ast.AST]:
              return {
                  node.name: node
                  for node in tree.body
                  if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef, ast.ClassDef))
                  and not node.name.startswith('_')
              }

          def public_methods(node: ast.ClassDef) -> set[str]:
              return {
                  child.name
                  for child in node.body
                  if isinstance(child, (ast.FunctionDef, ast.AsyncFunctionDef))
                  and not child.name.startswith('_')
              }

          for module in modules:
              stub = stub_root / f'{module}.pyi'
              source = source_root / f'{module}.py'
              if not stub.exists():
                  failures.append(f'missing stub: {stub}')
                  continue
              if not source.exists():
                  alternate = source_root / f'{module}.pyx'
                  if alternate.exists():
                      continue
                  failures.append(f'missing pinned source: {module}')
                  continue
              source_nodes = public_defs(ast.parse(source.read_text()))
              stub_nodes = public_defs(ast.parse(stub.read_text()))
              missing_defs = sorted(source_nodes.keys() - stub_nodes.keys())
              if missing_defs:
                  failures.append(f'{module}: missing definitions {missing_defs}')
              for name, source_node in source_nodes.items():
                  stub_node = stub_nodes.get(name)
                  if isinstance(source_node, ast.ClassDef) and isinstance(stub_node, ast.ClassDef):
                      missing_methods = sorted(public_methods(source_node) - public_methods(stub_node))
                      if missing_methods:
                          failures.append(f'{module}.{name}: missing methods {missing_methods}')
          if failures:
              raise SystemExit('\n'.join(failures))
          PY

      - name: Mark task complete and push immediately
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          phase = Path('.agents/phases/phase-04-number-theory-rings.md')
          text = phase.read_text()
          rows = [line for line in text.splitlines() if line.startswith('| T04.16 |')]
          if len(rows) != 1:
              raise SystemExit(f'expected one T04.16 row, found {len(rows)}')
          old = rows[0]
          complete = "| T04.16 | **Asymptotic ring subpackage** — `asymptotic_ring`, `asymptotic_expansion_generators`, `asymptotics_multivariate_generating_functions`, `growth_group`, `growth_group_cartesian`, `term_monoid`, `misc`. | 7 | — | ✅ Done | Full parent/element, construction, growth-group, term-monoid, expansion, logarithm, coefficient-map, symbolic-conversion, plotting, and multivariate generating-function surface is source-grounded against the pinned Sage source. |"
          if old != complete:
              phase.write_text(text.replace(old, complete))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sage-stubs/rings/asymptotic .agents/phases/phase-04-number-theory-rings.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'plan: complete T04.16 asymptotic rings'
          git push origin main
