      - name: Parse changed stubs
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          names = [
              "vector_double_dense",
              "vector_integer_dense",
              "vector_rational_dense",
              "vector_rational_sparse",
              "vector_modn_dense",
              "vector_modn_sparse",
              "vector_real_double_dense",
              "vector_complex_double_dense",
              "vector_symbolic_dense",
              "vector_symbolic_sparse",
              "vector_callable_symbolic_dense",
              "vector_numpy_dense",
              "vector_numpy_integer_dense",
          ]
          for name in names:
              path = Path("sage-stubs/modules") / f"{name}.pyi"
              ast.parse(path.read_text(), filename=str(path), feature_version=(3, 12))
          PY

      - name: Commit, rebase, and push to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "D. Zack Garza"
          git config user.email "dzackgarza@gmail.com"
          git add sage-stubs/modules
          git commit --no-verify -m "feat(stubs): type concrete vector coefficient domains"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
