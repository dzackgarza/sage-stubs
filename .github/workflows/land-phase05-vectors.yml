name: Land Phase 05 vector implementations

on:
  push:
    branches: [phase05-vector-implementations]
    paths:
      - .github/workflows/land-phase05-vectors.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 100

      - name: Write concrete vector stubs
        shell: bash
        run: |
          set -euo pipefail

          cat > sage-stubs/modules/vector_double_dense.pyi <<'PYI'
          from typing import Generic, Self, TypeVar

          from numpy import ndarray

          from sage.modules.free_module_element import FreeModuleElement_generic_dense
          from sage.structure.element import RingElement

          _DoubleScalar = TypeVar(
              "_DoubleScalar",
              bound=RingElement,
              default=RingElement,
          )


          class Vector_double_dense(
              FreeModuleElement_generic_dense[_DoubleScalar],
              Generic[_DoubleScalar],
          ):
              def numpy(self) -> ndarray: ...
              def norm(self, p: int | float | str = ...) -> float: ...
              def dot_product(
                  self,
                  right: Vector_double_dense[_DoubleScalar],
              ) -> _DoubleScalar: ...
              inner_product = dot_product
              def pairwise_product(
                  self,
                  right: Vector_double_dense[_DoubleScalar],
              ) -> Self: ...
          PYI

          cat > sage-stubs/modules/vector_integer_dense.pyi <<'PYI'
          from collections.abc import Sequence
          from typing import Self

          from sage.matrix.matrix_integer_dense import Matrix_integer_dense
          from sage.modules.free_module_element import FreeModuleElement_generic_dense
          from sage.rings.integer import Integer
          from sage.structure.parent import ElementConstructorInput


          class Vector_integer_dense(FreeModuleElement_generic_dense[Integer]):
              def __init__(
                  self,
                  parent: object,
                  entries: Sequence[int | Integer | ElementConstructorInput] = ...,
                  coerce: bool = ...,
                  copy: bool = ...,
              ) -> None: ...
              def __copy__(self) -> Self: ...
              def list(self, copy: bool = ...) -> list[Integer]: ...
              def denominator(self) -> Integer: ...
              def dot_product(self, right: Vector_integer_dense) -> Integer: ...
              inner_product = dot_product
              def pairwise_product(self, right: Vector_integer_dense) -> Self: ...
              def norm(self, p: int | float | None = ...) -> object: ...
              def row(self) -> Matrix_integer_dense: ...
              def column(self) -> Matrix_integer_dense: ...
              def gcd(self) -> Integer: ...
              content = gcd
          PYI

          cat > sage-stubs/modules/vector_rational_dense.pyi <<'PYI'
