              def expand(self) -> Self: ...
              def factor(self) -> Self: ...
              def subs(
                  self,
                  substitutions: Mapping[object, ElementConstructorInput] | None = ...,
                  **kwds: ElementConstructorInput,
              ) -> Self: ...
              substitute = subs
