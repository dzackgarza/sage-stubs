name: Apply phase 02 ring kernel

on:
  workflow_run:
    workflows: ["Apply phase 01 category kernel"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-02-ring-kernel-main
  cancel-in-progress: true

jobs:
  apply:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out current main and pinned Sage source
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install formatter
        run: python -m pip install --upgrade ruff

      - name: Require phase 01
        run: python scripts/check_category_kernel.py

      - name: Apply source-asserted ring kernel
        run: |
          set -euo pipefail
          python scripts/refine_ring_kernel.py
          ruff format \
            sage-stubs/rings/ring.pyi \
            sage-stubs/rings/commutative_ring.pyi \
            sage-stubs/rings/integral_domain.pyi \
            sage-stubs/rings/principal_ideal_domain.pyi \
            sage-stubs/rings/field.pyi \
            sage-stubs/rings/morphism.pyi \
            sage-stubs/rings/homset.pyi \
            typing_tests/ring_kernel/parents_and_homomorphisms.py
          python scripts/check_ring_kernel.py

      - name: Commit and push phase 02
        run: |
          set -euo pipefail
          git add \
            sage-stubs/rings/ring.pyi \
            sage-stubs/rings/commutative_ring.pyi \
            sage-stubs/rings/integral_domain.pyi \
            sage-stubs/rings/principal_ideal_domain.pyi \
            sage-stubs/rings/field.pyi \
            sage-stubs/rings/morphism.pyi \
            sage-stubs/rings/homset.pyi \
            typing_tests/ring_kernel/parents_and_homomorphisms.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Phase 02 is already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(types): preserve coefficient types through ring tower'
          git push origin HEAD:main
