name: Export refinement worktree

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/export-refinement-worktree.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and pinned Sage source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Archive source, stubs, and validation tooling
        run: |
          set -euo pipefail
          tar -czf /tmp/sage-stubs-refinement-worktree.tar.gz \
            sage-src/src/sage \
            sage-stubs \
            scripts \
            pyproject.toml \
            pyrightconfig.json \
            .semgrep \
            .github/workflows/stub-quality.yml
          sha256sum /tmp/sage-stubs-refinement-worktree.tar.gz
          du -h /tmp/sage-stubs-refinement-worktree.tar.gz

      - name: Upload refinement worktree
        uses: actions/upload-artifact@v7
        with:
          name: sage-stubs-refinement-worktree
          path: /tmp/sage-stubs-refinement-worktree.tar.gz
          if-no-files-found: error
          compression-level: 0
