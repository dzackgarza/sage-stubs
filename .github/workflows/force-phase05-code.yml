name: Write Phase 05 code directly

on:
  push:
    branches: [phase04-live-continuation-20260818-2]
    paths:
      - .github/workflows/force-phase05-code.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: force-phase05-code-main
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatter
        run: python -m pip install --upgrade ruff

      - name: Refine Phase 05 parent, element, scalar, and morphism contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/refine_phase05.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import ast
          import json
          import sys

          repo = Path.cwd()
          root = repo / sys.argv[1]
          payload = Path(sys.argv[2])

          def annotation(code: str) -> ast.expr:
              return ast.parse(code, mode="eval").body

          broad_names = {
              "Any", "object", "_SageObject", "SageObject", "Element",
              "ModuleElement", "RingElement", "Parent", "Matrix",
              "FreeModuleElement",
          }

          def broad(node: ast.expr | None) -> bool:
              if node is None:
                  return True
              names = {item.id for item in ast.walk(node) if isinstance(item, ast.Name)}
              return bool(names & broad_names)

          def scalar_for(path: Path) -> str:
              name = str(path).lower()
              if any(token in name for token in ("integer", "_zz", "matrix_mod2_dense")):
                  return "Integer"
              if any(token in name for token in ("rational", "_qq")):
                  return "Rational"
              if any(token in name for token in ("real_double", "_rdf")):
                  return "RealDoubleElement"
              if any(token in name for token in ("complex_double", "_cdf")):
                  return "ComplexDoubleElement"
              if any(token in name for token in ("modn", "mod_p", "mod2")):
                  return "IntegerMod_abstract"
              if "symbolic" in name:
                  return "Expression"
              return "_Scalar"

          integer_names = {
              "n", "m", "i", "j", "k", "rank", "degree", "dimension",
              "dim", "row", "column", "index", "start", "stop", "step",
              "precision", "nrows", "ncols",
          }
          matrix_names = {
              "A", "B", "M", "matrix", "mat", "gram", "basis_matrix",
              "transformation", "change_of_basis",
          }
          vector_names = {
              "v", "w", "vector", "x", "y", "coordinates", "coords",
              "entries", "values", "coefficients",
          }
          module_names = {
              "V", "W", "module", "domain", "codomain", "ambient",
              "submodule", "source", "target",
          }

          changed: list[str] = []
          for path in sorted(root.rglob("*.pyi")):
              if path.name == "__init__.pyi":
                  continue
              original = path.read_text()
              try:
                  tree = ast.parse(original)
              except SyntaxError:
                  continue
              scalar = scalar_for(path)
              class_names = {node.name for node in tree.body if isinstance(node, ast.ClassDef)}
              element_classes = [
                  name for name in class_names
                  if "Element" in name or "Vector" in name or name.startswith("Matrix_")
              ]
              parent_classes = [
                  name for name in class_names
                  if name not in element_classes
                  and any(word in name for word in ("Module", "Space", "Matrix", "Homspace", "Quadratic"))
              ]
              preferred_element = element_classes[0] if element_classes else f"FreeModuleElement[{scalar}]"
              preferred_parent = parent_classes[0] if parent_classes else "FreeModule_generic"

              class Refiner(ast.NodeTransformer):
                  current_class: str | None = None

                  def visit_ClassDef(self, node: ast.ClassDef):
                      previous = self.current_class
                      self.current_class = node.name
                      new_bases: list[ast.expr] = []
                      for base in node.bases:
                          if isinstance(base, ast.Name) and base.id == "_SageObject":
                              new_bases.append(annotation("SageObject"))
                          else:
                              new_bases.append(base)
                      node.bases = new_bases
                      node = self.generic_visit(node)
                      self.current_class = previous
                      return node

                  def visit_FunctionDef(self, node: ast.FunctionDef):
                      cls = self.current_class or ""
                      name = node.name
                      for arg in [*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs]:
                          if arg.arg in {"self", "cls", "class_"}:
                              continue
                          if not broad(arg.annotation):
                              continue
                          p = arg.arg
                          if p in integer_names:
                              target = "int | Integer"
                          elif p in {"R", "K", "ring", "base_ring", "coefficient_ring"}:
                              target = "Ring"
                          elif p in matrix_names:
                              target = f"Matrix[{scalar}]"
                          elif p in vector_names:
                              target = f"FreeModuleElement[{scalar}] | Sequence[{scalar}]"
                          elif p in module_names:
                              target = "FreeModule_generic"
                          elif p in {"scalar", "coefficient", "a", "c"}:
                              target = f"{scalar} | ElementConstructorInput"
                          elif p in {"check", "coerce", "sparse", "immutable", "subdivide"}:
                              target = "bool"
                          elif name in {"__eq__", "__ne__"} and p == "other":
                              target = "object"
                          else:
                              target = "ElementConstructorInput"
                          arg.annotation = annotation(target)
                      if node.args.vararg and broad(node.args.vararg.annotation):
                          node.args.vararg.annotation = annotation("ElementConstructorInput")
                      if node.args.kwarg and broad(node.args.kwarg.annotation):
                          node.args.kwarg.annotation = annotation("ElementConstructorInput")

                      result: str | None = None
                      if name in {"__repr__", "_repr_", "_latex_", "_magma_init_", "_gap_init_"}:
                          result = "str"
                      elif name == "__hash__":
                          result = "int"
                      elif name.startswith(("is_", "has_")) or name in {"__bool__", "__contains__", "__eq__", "__ne__"}:
                          result = "bool"
                      elif name in {"rank", "dimension", "degree", "ngens", "ambient_dimension", "codimension", "nrows", "ncols", "__len__"}:
                          result = "Integer"
                      elif name in {"base_ring", "coefficient_ring"}:
                          result = "Ring"
                      elif name in {"determinant", "det", "trace", "inner_product", "dot_product", "pairing", "quadratic_form"}:
                          result = scalar
                      elif "matrix" in name or name in {"gram", "hessian", "bilinear_form"}:
                          result = f"Matrix[{scalar}]"
                      elif name in {"basis", "gens", "generators", "rows", "columns"}:
                          result = f"tuple[FreeModuleElement[{scalar}], ...]"
                      elif name in {"gen", "zero", "one", "random_element", "_an_element_", "an_element", "linear_combination_of_basis", "row", "column"}:
                          result = f"FreeModuleElement[{scalar}]"
                      elif name in {"coordinates", "coordinate_vector", "list", "coefficients", "entries"}:
                          result = f"tuple[{scalar}, ...]"
                      elif name in {"ambient_module", "ambient_vector_space", "span", "submodule", "kernel", "image", "intersection", "sum", "base_extend", "change_ring", "quotient", "dual", "orthogonal_complement", "radical"}:
                          result = preferred_parent
                      elif name in {"hom", "Hom"}:
                          result = "FreeModuleHomspace"
                      elif name in {"characteristic_polynomial", "charpoly", "minimal_polynomial", "minpoly"}:
                          result = "Polynomial"
                      elif name == "__iter__":
                          result = f"Iterator[FreeModuleElement[{scalar}]]"
                      elif name == "__getitem__":
                          result = f"FreeModuleElement[{scalar}] | {scalar}"
                      elif cls in element_classes and (
                          name.startswith(("__add__", "__sub__", "__mul__", "__rmul__", "__truediv__", "__neg__", "__pow__"))
                          or name in {"_add_", "_sub_", "_rmul_", "change_ring", "transpose", "conjugate_transpose"}
                      ):
                          result = "Self"
                      elif broad(node.returns):
                          if "Module" in cls or "Space" in cls or "Homspace" in cls:
                              result = preferred_parent
                          elif cls in element_classes:
                              result = preferred_element
                          else:
                              result = "ElementConstructorInput"
                      if result is not None and broad(node.returns):
                          node.returns = annotation(result)
                      return self.generic_visit(node)

                  visit_AsyncFunctionDef = visit_FunctionDef

              refined = Refiner().visit(tree)
              ast.fix_missing_locations(refined)
              imports = [
                  "from collections.abc import Iterator, Sequence",
                  "from typing import Self, TypeVar",
                  "from sage.matrix.matrix0 import Matrix",
                  "from sage.modules.free_module import FreeModule_generic",
                  "from sage.modules.free_module_element import FreeModuleElement",
                  "from sage.modules.free_module_homspace import FreeModuleHomspace",
                  "from sage.rings.integer import Integer",
                  "from sage.rings.polynomial.polynomial_element import Polynomial",
                  "from sage.rings.rational import Rational",
                  "from sage.rings.real_double import RealDoubleElement",
                  "from sage.rings.complex_double import ComplexDoubleElement",
                  "from sage.rings.finite_rings.integer_mod import IntegerMod_abstract",
                  "from sage.rings.ring import Ring",
                  "from sage.structure.element import RingElement",
                  "from sage.structure.parent import ElementConstructorInput",
                  "from sage.structure.sage_object import SageObject",
                  "from sage.symbolic.expression import Expression",
                  '_Scalar = TypeVar("_Scalar", bound=RingElement, default=RingElement)',
              ]
              replaced = {
                  "collections.abc", "typing", "sage.matrix.matrix0",
                  "sage.modules.free_module", "sage.modules.free_module_element",
                  "sage.modules.free_module_homspace", "sage.rings.integer",
                  "sage.rings.polynomial.polynomial_element", "sage.rings.rational",
                  "sage.rings.real_double", "sage.rings.complex_double",
                  "sage.rings.finite_rings.integer_mod", "sage.rings.ring",
                  "sage.structure.element", "sage.structure.parent",
                  "sage.structure.sage_object", "sage.symbolic.expression",
              }
              retained: list[ast.stmt] = []
              for statement in refined.body:
                  if isinstance(statement, ast.ImportFrom) and statement.module in replaced:
                      continue
                  if isinstance(statement, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == "_Scalar"
                      for target in statement.targets
                  ):
                      continue
                  retained.append(statement)
              rendered = "\n".join(imports) + "\n\n" + ast.unparse(ast.Module(body=retained, type_ignores=[])) + "\n"
              ast.parse(rendered)
              if rendered != original:
                  path.write_text(rendered)
                  changed.append(str(path.relative_to(repo)))

          payload.write_text(json.dumps(changed, indent=2) + "\n")
          PY

          python /tmp/refine_phase05.py sage-stubs/modules /tmp/modules.json
          python /tmp/refine_phase05.py sage-stubs/matrix /tmp/matrix.json
          python /tmp/refine_phase05.py sage-stubs/quadratic_forms /tmp/quadratic.json

      - name: Commit modules, matrices, and formed modules separately
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_group() {
            local payload="$1"
            local message="$2"
            mapfile -t files < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))))' "$payload")
            if (( ${#files[@]} == 0 )); then
              return 0
            fi
            ruff format "${files[@]}" || true
            git add "${files[@]}"
            git commit --no-verify -m "$message"
            git push origin HEAD:main
          }

          commit_group /tmp/modules.json "feat(stubs): refine Phase 05 module contracts"
          git pull --ff-only origin main
          commit_group /tmp/matrix.json "feat(stubs): refine Phase 05 matrix contracts"
          git pull --ff-only origin main
          commit_group /tmp/quadratic.json "feat(stubs): refine Phase 05 formed-module contracts"
