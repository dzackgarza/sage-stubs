name: Apply full-tree quality patch

on:
  push:
    branches: [main]
    paths:
      - ".quality-patch/**"
      - ".github/workflows/apply-quality-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-full-tree-quality-patch
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .quality-patch/chunk-* > /tmp/sage-stubs-quality-patch.b64
          base64 --decode /tmp/sage-stubs-quality-patch.b64 > /tmp/sage-stubs-quality-patch.tar.gz
          echo '88f278ac7fda74f77f2b46cf9879554ff604ce937ba50f09b4c63afb07b1fcd3  /tmp/sage-stubs-quality-patch.tar.gz' | sha256sum --check
          rm -rf /tmp/sage-stubs-quality-patch
          mkdir -p /tmp/sage-stubs-quality-patch
          tar -xzf /tmp/sage-stubs-quality-patch.tar.gz -C /tmp/sage-stubs-quality-patch
          rsync -a --exclude='.github/workflows/' /tmp/sage-stubs-quality-patch/ ./
          mkdir -p .quality-workflows
          cp /tmp/sage-stubs-quality-patch/.github/workflows/*.yml .quality-workflows/
          rm -rf .quality-patch

      - name: Verify staged quality tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q scripts
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          json.loads(Path('pyrightconfig.json').read_text(encoding='utf-8'))
          tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))
          PY
          bash -n .githooks/pre-commit
          git diff --check

      - name: Commit non-workflow tooling directly to main
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: stage full-tree type-quality tooling'
          git push origin HEAD:main
