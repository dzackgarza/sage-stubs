name: Apply phase 01 category kernel

on:
  push:
    branches: [main]
    paths:
      - scripts/refine_category_kernel.py
      - scripts/refine_category_kernel_v2.py
      - scripts/check_category_kernel.py
      - typing_tests/category_kernel/**
      - .github/workflows/apply-phase-01-category-kernel.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase-01-category-kernel-main
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository and pinned Sage source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install formatter
        run: python -m pip install --upgrade ruff

      - name: Apply source-asserted category kernel
        run: |
          set -euo pipefail
          python scripts/refine_category_kernel_v2.py
          ruff format \
            sage-stubs/structure/element.pyi \
            sage-stubs/structure/parent.pyi \
            sage-stubs/categories/map.pyi \
            sage-stubs/categories/morphism.pyi \
            sage-stubs/categories/homset.pyi \
            typing_tests/category_kernel/homset.py
          python scripts/check_category_kernel.py

      - name: Commit and push phase 01
        run: |
          set -euo pipefail
          git add \
            sage-stubs/structure/element.pyi \
            sage-stubs/structure/parent.pyi \
            sage-stubs/categories/map.pyi \
            sage-stubs/categories/morphism.pyi \
            sage-stubs/categories/homset.pyi \
            typing_tests/category_kernel/homset.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Phase 01 is already present.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(types): reconstruct category-parent-element kernel'
          git push origin HEAD:main
