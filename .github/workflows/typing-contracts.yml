name: Mathematical typing contracts

on:
  push:
    branches: [main]
    paths:
      - "sage-stubs/**/*.pyi"
      - "typing_tests/**/*.py"
      - pyrightconfig.json
      - .github/workflows/typing-contracts.yml
  pull_request:
    paths:
      - "sage-stubs/**/*.pyi"
      - "typing_tests/**/*.py"
      - pyrightconfig.json
      - .github/workflows/typing-contracts.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install type checkers
        run: python -m pip install --upgrade mypy basedpyright

      - name: Check contract examples with mypy
        env:
          MYPYPATH: sage-stubs
        run: |
          python -m mypy \
            --strict \
            --no-incremental \
            --follow-imports=normal \
            --show-error-codes \
            typing_tests/

      - name: Check contract examples with basedpyright
        run: |
          basedpyright \
            --pythonpath "$(command -v python)" \
            --pythonversion 3.12 \
            --level error \
            typing_tests/
