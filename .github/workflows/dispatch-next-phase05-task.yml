name: Dispatch next Phase 05 implementation

on:
  push:
    branches: [phase04-live-continuation-20260818-2]
    paths:
      - .github/workflows/dispatch-next-phase05-task.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch implementation workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/implement-next-phase05-task.yml/dispatches \
            -d '{"ref":"phase04-live-continuation-20260818-2"}'
