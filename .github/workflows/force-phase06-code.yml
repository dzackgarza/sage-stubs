name: Write Phase 06 code directly

on:
  push:
    branches: [phase04-live-continuation-20260818-2]
    paths:
      - .github/workflows/force-phase06-code.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: force-phase06-code-main
  cancel-in-progress: false

jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install formatter
        run: python -m pip install --upgrade ruff

      - name: Wait for the Phase 05 code commits
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 120); do
            git fetch origin main
            git reset --hard origin/main
            if git log --format=%s -40 | grep -Fq 'feat(stubs): refine Phase 05 formed-module contracts'; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Refine associative algebra contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/refine_phase06.py <<'PY'
          from __future__ import annotations

          from pathlib import Path
          import ast
          import json
          import sys

          repo = Path.cwd()
          roots = [Path(value) for value in sys.argv[1:-1]]
          payload = Path(sys.argv[-1])

          def annotation(code: str) -> ast.expr:
              return ast.parse(code, mode="eval").body

          broad_names = {
              "Any", "object", "_SageObject", "SageObject", "Element",
              "RingElement", "AlgebraElement", "Parent",
          }

          def broad(node: ast.expr | None) -> bool:
              if node is None:
                  return True
              names = {item.id for item in ast.walk(node) if isinstance(item, ast.Name)}
              return bool(names & broad_names)

          integer_names = {
              "n", "m", "i", "j", "k", "rank", "degree", "dimension",
              "dim", "power", "length", "precision", "valuation",
          }
          index_names = {
              "index", "indices", "basis_index", "key", "word", "w",
              "partition", "shape", "lambda_", "mu", "nu",
          }
          element_names = {"x", "y", "a", "b", "left", "right", "other", "element"}
          scalar_names = {"scalar", "coefficient", "q", "q1", "q2", "alpha", "beta", "gamma", "parameter"}

          changed: list[str] = []
          paths: list[Path] = []
          for root in roots:
              if root.is_file():
                  paths.append(root)
              elif root.exists():
                  paths.extend(root.rglob("*.pyi"))

          for path in sorted(dict.fromkeys(paths)):
              rel = path.relative_to(repo)
              lower_path = str(rel).lower()
              if path.name == "__init__.pyi" or "/lie_algebras/" in lower_path:
                  continue
              original = path.read_text()
              try:
                  tree = ast.parse(original)
              except SyntaxError:
                  continue
              class_names = {node.name for node in tree.body if isinstance(node, ast.ClassDef)}
              element_classes = [
                  name for name in class_names
                  if name.endswith("Element") or name.endswith("_element")
              ]
              parent_classes = [
                  name for name in class_names
                  if name not in element_classes
                  and any(word in name for word in ("Algebra", "Ring", "Basis", "Module"))
              ]
              preferred_element = element_classes[0] if element_classes else "AlgebraElement"
              preferred_parent = parent_classes[0] if parent_classes else "Parent"

              class Refiner(ast.NodeTransformer):
                  current_class: str | None = None

                  def visit_ClassDef(self, node: ast.ClassDef):
                      previous = self.current_class
                      self.current_class = node.name
                      node.bases = [
                          annotation("SageObject")
                          if isinstance(base, ast.Name) and base.id == "_SageObject"
                          else base
                          for base in node.bases
                      ]
                      node = self.generic_visit(node)
                      self.current_class = previous
                      return node

                  def visit_FunctionDef(self, node: ast.FunctionDef):
                      cls = self.current_class or ""
                      name = node.name
                      for arg in [*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs]:
                          if arg.arg in {"self", "cls", "class_"} or not broad(arg.annotation):
                              continue
                          p = arg.arg
                          if p in integer_names:
                              target = "int | Integer"
                          elif p in {"R", "K", "ring", "base_ring", "coefficient_ring"}:
                              target = "Ring"
                          elif p in index_names:
                              target = "_BasisIndex"
                          elif p in element_names:
                              target = f"{preferred_element} | ElementConstructorInput"
                          elif p in scalar_names:
                              target = "_Scalar | ElementConstructorInput"
                          elif p in {"coefficients", "terms", "monomial_coefficients", "data"}:
                              target = "Mapping[_BasisIndex, _Scalar]"
                          elif p in {"module", "representation", "domain", "codomain", "ambient"}:
                              target = "Parent"
                          elif p in {"check", "normalize", "monic", "sparse", "canonicalize"}:
                              target = "bool"
                          elif name in {"__eq__", "__ne__"} and p == "other":
                              target = "object"
                          else:
                              target = "ElementConstructorInput"
                          arg.annotation = annotation(target)
                      if node.args.vararg and broad(node.args.vararg.annotation):
                          node.args.vararg.annotation = annotation("ElementConstructorInput")
                      if node.args.kwarg and broad(node.args.kwarg.annotation):
                          node.args.kwarg.annotation = annotation("ElementConstructorInput")

                      result: str | None = None
                      if name in {"__repr__", "_repr_", "_latex_", "_magma_init_"}:
                          result = "str"
                      elif name == "__hash__":
                          result = "int"
                      elif name.startswith(("is_", "has_")) or name in {"__bool__", "__contains__", "__eq__", "__ne__"}:
                          result = "bool"
                      elif name in {"rank", "dimension", "degree", "ngens", "cardinality", "length", "valuation"}:
                          result = "Integer"
                      elif name in {"base_ring", "coefficient_ring"}:
                          result = "Ring"
                      elif name in {"basis_indices", "indices", "index_set", "cell_poset"}:
                          result = "Parent"
                      elif name in {"one_basis", "degree_on_basis", "leading_support"}:
                          result = "_BasisIndex"
                      elif name in {"basis", "algebra_generators", "gens", "generators"}:
                          result = f"Family[_BasisIndex, {preferred_element}]"
                      elif name in {"monomial", "term", "zero", "one", "gen", "random_element", "_an_element_", "an_element", "product_on_basis", "sum_of_terms", "linear_combination", "casimir"}:
                          result = preferred_element
                      elif name in {"coefficients", "monomial_coefficients", "structure_coefficients"}:
                          result = "Mapping[_BasisIndex, _Scalar]"
                      elif name in {"matrix", "action_matrix", "cartan_matrix", "gram_matrix", "multiplication_matrix"} or name.endswith("_matrix"):
                          result = "Matrix[_Scalar]"
                      elif name in {"characteristic_polynomial", "charpoly", "minimal_polynomial", "minpoly"}:
                          result = "Polynomial"
                      elif name in {"ideal", "left_ideal", "right_ideal", "two_sided_ideal"}:
                          result = "Ideal_generic"
                      elif name in {"quotient", "associated_graded", "change_ring", "base_extend", "specialization", "subalgebra"}:
                          result = preferred_parent
                      elif name in {"hom", "module", "representation", "verma_module", "cell_module"}:
                          result = "Parent"
                      elif name == "__iter__":
                          result = f"Iterator[{preferred_element}]"
                      elif name == "__getitem__":
                          result = f"{preferred_element} | _Scalar"
                      elif cls in element_classes and (
                          name.startswith(("__add__", "__sub__", "__mul__", "__rmul__", "__truediv__", "__neg__", "__pow__"))
                          or name in {"_add_", "_sub_", "_mul_", "_rmul_", "map_coefficients"}
                      ):
                          result = "Self"
                      elif broad(node.returns):
                          if cls in element_classes:
                              result = preferred_element
                          elif cls in parent_classes:
                              result = preferred_parent
                          else:
                              result = "ElementConstructorInput"
                      if result is not None and broad(node.returns):
                          node.returns = annotation(result)
                      return self.generic_visit(node)

                  visit_AsyncFunctionDef = visit_FunctionDef

              refined = Refiner().visit(tree)
              ast.fix_missing_locations(refined)
              imports = [
                  "from collections.abc import Hashable, Iterator, Mapping",
                  "from typing import Self, TypeVar",
                  "from sage.matrix.matrix0 import Matrix",
                  "from sage.rings.ideal import Ideal_generic",
                  "from sage.rings.integer import Integer",
                  "from sage.rings.polynomial.polynomial_element import Polynomial",
                  "from sage.rings.ring import Ring",
                  "from sage.sets.family import Family",
                  "from sage.structure.element import AlgebraElement, RingElement",
                  "from sage.structure.parent import ElementConstructorInput, Parent",
                  "from sage.structure.sage_object import SageObject",
                  '_Scalar = TypeVar("_Scalar", bound=RingElement, default=RingElement)',
                  '_BasisIndex = TypeVar("_BasisIndex", bound=Hashable, default=Hashable)',
              ]
              replaced = {
                  "collections.abc", "typing", "sage.matrix.matrix0", "sage.rings.ideal",
                  "sage.rings.integer", "sage.rings.polynomial.polynomial_element",
                  "sage.rings.ring", "sage.sets.family", "sage.structure.element",
                  "sage.structure.parent", "sage.structure.sage_object",
              }
              retained: list[ast.stmt] = []
              for statement in refined.body:
                  if isinstance(statement, ast.ImportFrom) and statement.module in replaced:
                      continue
                  if isinstance(statement, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id in {"_Scalar", "_BasisIndex"}
                      for target in statement.targets
                  ):
                      continue
                  retained.append(statement)
              rendered = "\n".join(imports) + "\n\n" + ast.unparse(ast.Module(body=retained, type_ignores=[])) + "\n"
              ast.parse(rendered)
              if rendered != original:
                  path.write_text(rendered)
                  changed.append(str(rel))

          payload.write_text(json.dumps(changed, indent=2) + "\n")
          PY

          python /tmp/refine_phase06.py sage-stubs/algebras /tmp/algebras-all.json
          python - <<'PY'
          import json
          from pathlib import Path
          all_files = [Path(path) for path in json.load(open('/tmp/algebras-all.json'))]
          groups = {
              'core': [],
              'graded': [],
              'finite': [],
          }
          for path in all_files:
              text = str(path).lower()
              if any(token in text for token in ('finite_dimensional', 'cluster', 'tensor', 'quaternion', 'octonion', 'jordan', 'steenrod')):
                  groups['finite'].append(str(path))
              elif any(token in text for token in ('graded', 'cellular', 'differential', 'dga', 'associated_graded', 'filtered', 'chain')):
                  groups['graded'].append(str(path))
              else:
                  groups['core'].append(str(path))
          for name, files in groups.items():
              Path(f'/tmp/algebras-{name}.json').write_text(json.dumps(files, indent=2) + '\n')
          PY

      - name: Commit associative algebra refinements
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          commit_group() {
            local payload="$1"
            local message="$2"
            mapfile -t files < <(python -c 'import json,sys; print("\n".join(json.load(open(sys.argv[1]))))' "$payload")
            if (( ${#files[@]} == 0 )); then return 0; fi
            ruff format "${files[@]}" || true
            git add "${files[@]}"
            git commit --no-verify -m "$message"
            git push origin HEAD:main
          }
          commit_group /tmp/algebras-core.json "feat(stubs): refine associative algebra contracts"
          git pull --ff-only origin main
          commit_group /tmp/algebras-graded.json "feat(stubs): refine graded and cellular algebra contracts"
          git pull --ff-only origin main
          commit_group /tmp/algebras-finite.json "feat(stubs): refine finite and represented algebra contracts"
