name: Finalize Phase 04 idempotently

on:
  push:
    branches: [phase-ready-status-loop]
    paths:
      - .github/workflows/finalize-phase-04-idempotent.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analyzers
        run: python -m pip install --upgrade pip ruff mypy basedpyright

      - name: Complete only if still incomplete and all gates pass
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C phase-04-idempotent origin/main
          plan=.agents/phases/phase-04-number-theory-rings.md
          if grep -q '^\*\*Status:\*\* ✅ Complete$' "$plan"; then
            exit 0
          fi

          targets=(
            sage-stubs/rings/finite_rings
            sage-stubs/rings/number_field
            sage-stubs/rings/padics
            sage-stubs/rings/function_field
            sage-stubs/rings/valuation
            sage-stubs/rings/asymptotic
            sage-stubs/rings/semirings
          )
          mapfile -t stubs < <(find "${targets[@]}" -name '*.pyi' -print | sort)
          ruff check "${stubs[@]}"
          ruff format --check "${stubs[@]}"
          python scripts/check_stubs.py "${stubs[@]}"
          python -m mypy --strict --no-incremental --follow-imports=silent --show-error-codes "${stubs[@]}"

          python - <<'PY'
          import json
          from pathlib import Path
          targets = [
              'sage-stubs/rings/finite_rings',
              'sage-stubs/rings/number_field',
              'sage-stubs/rings/padics',
              'sage-stubs/rings/function_field',
              'sage-stubs/rings/valuation',
              'sage-stubs/rings/asymptotic',
              'sage-stubs/rings/semirings',
          ]
          Path('/tmp/p4-pyright.json').write_text(json.dumps({
              'include': targets,
              'stubPath': 'sage-stubs',
              'pythonVersion': '3.12',
              'typeCheckingMode': 'strict',
              'reportMissingTypeStubs': False,
              'reportMissingImports': 'error',
          }, indent=2) + '\n')
          PY
          basedpyright --project /tmp/p4-pyright.json --level error
          for target in "${targets[@]}"; do
            python scripts/audit_stub_quality.py --root "$target" --max-console 1000
          done

          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('.agents/phases/phase-04-number-theory-rings.md')
          text = path.read_text()
          text = re.sub(r'^(\*\*Status:\*\*)\s*.*$', r'\1 ✅ Complete', text, count=1, flags=re.MULTILINE)
          text = re.sub(r'^(\| T04\.\d+ \|.*?\|) (?:⬜|🟡) (\|.*)$', r'\1 ✅ Done \2', text, flags=re.MULTILINE)
          if '**Status:** ✅ Complete' not in text or ' ⬜ ' in text:
              raise SystemExit('Phase 04 plan did not advance completely')
          path.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$plan"
          git commit -m 'feat(stubs): complete Phase 04 number-theoretic rings'
          git push origin HEAD:main
