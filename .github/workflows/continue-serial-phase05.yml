name: Continue serial Phase 05 implementation

on:
  push:
    branches: [phase04-live-continuation-20260818-2]
    paths:
      - .github/workflows/continue-serial-phase05.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  continue:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Await preceding serial run, then dispatch three more tasks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          serial_id=$(curl -fsSL "${headers[@]}" \
            "${api}/actions/workflows/serial-phase05-implementation.yml/runs?branch=phase04-live-continuation-20260818-2&per_page=1" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          for attempt in $(seq 1 120); do
            serial_state=$(curl -fsSL "${headers[@]}" "${api}/actions/runs/${serial_id}" \
              | python -c 'import json,sys; r=json.load(sys.stdin); print((r["status"] or "")+":"+(r["conclusion"] or ""))')
            case "$serial_state" in
              completed:success) break ;;
              completed:*) echo "preceding serial run failed: ${serial_state}"; exit 1 ;;
            esac
            sleep 5
          done
          [[ "$serial_state" == "completed:success" ]]

          for round in 1 2 3; do
            before=$(curl -fsSL "${headers[@]}" \
              "${api}/actions/workflows/implement-next-phase05-task.yml/runs?branch=phase04-live-continuation-20260818-2&per_page=1" \
              | python -c 'import json,sys; d=json.load(sys.stdin); print(d["workflow_runs"][0]["id"] if d["workflow_runs"] else 0)')
            curl --fail-with-body -sS "${headers[@]}" -X POST \
              "${api}/actions/workflows/implement-next-phase05-task.yml/dispatches" \
              -d '{"ref":"phase04-live-continuation-20260818-2"}'
            run_id=""
            for attempt in $(seq 1 30); do
              sleep 4
              run_id=$(curl -fsSL "${headers[@]}" \
                "${api}/actions/workflows/implement-next-phase05-task.yml/runs?branch=phase04-live-continuation-20260818-2&event=workflow_dispatch&per_page=5" \
                | python -c 'import json,sys; before=int(sys.argv[1]); runs=json.load(sys.stdin)["workflow_runs"]; print(next((str(r["id"]) for r in runs if r["id"] != before), ""))' "$before")
              [[ -n "$run_id" ]] && break
            done
            [[ -n "$run_id" ]]
            for attempt in $(seq 1 90); do
              state=$(curl -fsSL "${headers[@]}" "${api}/actions/runs/${run_id}" \
                | python -c 'import json,sys; r=json.load(sys.stdin); print((r["status"] or "")+":"+(r["conclusion"] or ""))')
              case "$state" in
                completed:success) break ;;
                completed:*) echo "implementation run ${run_id} failed: ${state}"; exit 1 ;;
              esac
              sleep 5
            done
            [[ "$state" == "completed:success" ]]
          done
