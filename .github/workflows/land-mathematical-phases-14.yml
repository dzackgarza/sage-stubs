name: Land fourteen mathematical typing phases

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/land-mathematical-phases-14.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: land-fourteen-mathematical-typing-phases
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Merge completed phase chain into main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin typing-phase-14-graphs-matroids
          git merge --no-ff --no-edit origin/typing-phase-14-graphs-matroids
          git push origin HEAD:main
