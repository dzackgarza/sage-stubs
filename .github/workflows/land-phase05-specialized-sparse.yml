      - name: Parse changed stubs
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          names = [
              "matrix_integer_sparse",
              "matrix_rational_sparse",
              "matrix_symbolic_dense",
              "matrix_symbolic_sparse",
              "matrix_gap",
              "matrix_gfpn_dense",
              "matrix_gf2_dense",
              "matrix_gf2e_dense",
              "matrix_cyclo_dense",
          ]
          for name in names:
              path = Path("sage-stubs/matrix") / f"{name}.pyi"
              ast.parse(path.read_text(), filename=str(path), feature_version=(3, 12))
          PY

      - name: Commit, rebase, and push to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "D. Zack Garza"
          git config user.email "dzackgarza@gmail.com"
          git add sage-stubs/matrix
          git commit --no-verify -m "feat(stubs): type sparse and finite-field matrix domains"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
