name: Apply category-kernel refinement

on:
  push:
    branches: [main]
    paths:
      - scripts/refine_category_kernel.py
      - scripts/refine_category_kernel_v2.py
      - .github/workflows/apply-category-kernel.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-category-kernel-main
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository and pinned Sage source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install focused validators
        run: python -m pip install --upgrade ruff mypy basedpyright

      - name: Apply reviewed category-kernel relationships
        run: python scripts/refine_category_kernel_v2.py

      - name: Normalize changed declarations
        run: |
          ruff format \
            sage-stubs/structure/element.pyi \
            sage-stubs/structure/parent.pyi \
            sage-stubs/categories/map.pyi \
            sage-stubs/categories/morphism.pyi \
            sage-stubs/categories/homset.pyi \
            typing_tests/category_kernel/homset.py

      - name: Validate syntax and stub contracts
        run: |
          python -m py_compile \
            sage-stubs/structure/element.pyi \
            sage-stubs/structure/parent.pyi \
            sage-stubs/categories/map.pyi \
            sage-stubs/categories/morphism.pyi \
            sage-stubs/categories/homset.pyi
          python scripts/check_stubs.py \
            sage-stubs/structure/element.pyi \
            sage-stubs/structure/parent.pyi \
            sage-stubs/categories/map.pyi \
            sage-stubs/categories/morphism.pyi \
            sage-stubs/categories/homset.pyi

      - name: Check the mathematical contract example
        env:
          MYPYPATH: sage-stubs
        run: |
          python -m mypy \
            --strict \
            --no-incremental \
            --follow-imports=silent \
            --show-error-codes \
            typing_tests/category_kernel/homset.py

      - name: Commit the phase result
        run: |
          set -euo pipefail
          git add \
            sage-stubs/structure/element.pyi \
            sage-stubs/structure/parent.pyi \
            sage-stubs/categories/map.pyi \
            sage-stubs/categories/morphism.pyi \
            sage-stubs/categories/homset.pyi \
            typing_tests/category_kernel/homset.py
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Category kernel already has the reviewed relationships.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor(types): reconstruct category-parent-element kernel'
          git push origin HEAD:main
