name: Land T04.17 semiring task

on:
  push:
    branches: [t04-17-semirings-validation]
    paths:
      - .github/workflows/materialize-t04-17-semirings-final.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode final source-grounded task patch
        run: |
          set -euo pipefail
          cat > /tmp/t04-17-final.b64 <<'PATCH'
          
          PATCH
          tr -d '[:space:]' < /tmp/t04-17-final.b64 | base64 -d > /tmp/t04-17-final.patch.bz2
          echo '6ada63aa16f0534673942b8575b9744ff2456f7cbc5a0ba443d6c7733826d76a  /tmp/t04-17-final.patch.bz2' | sha256sum -c -
          bzip2 -dc /tmp/t04-17-final.patch.bz2 > /tmp/t04-17-final.patch

      - name: Apply task to clean final branch
        run: |
          set -euo pipefail
          git fetch origin t04-17-semirings-final
          git switch -C t04-17-semirings-final origin/t04-17-semirings-final
          test "$(git rev-parse HEAD)" = '863e972fd4c5c696d4fe0aa521d0a732c2421d0e'
          git apply --check /tmp/t04-17-final.patch
          git apply /tmp/t04-17-final.patch

      - name: Install analyzers
        run: python -m pip install --upgrade pip ruff mypy basedpyright

      - name: Normalize formatting
        run: |
          set -euo pipefail
          ruff check --fix             sage-stubs/structure/element.pyi             sage-stubs/structure/parent.pyi             sage-stubs/rings/polynomial/multi_polynomial_element.pyi             sage-stubs/rings/semirings
          ruff format             sage-stubs/structure/element.pyi             sage-stubs/structure/parent.pyi             sage-stubs/rings/polynomial/multi_polynomial_element.pyi             sage-stubs/rings/semirings

      - name: Validate task and accepted source-level incompatibilities
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/reports
          target=sage-stubs/rings/semirings
          ruff check "$target" sage-stubs/structure/element.pyi sage-stubs/structure/parent.pyi sage-stubs/rings/polynomial/multi_polynomial_element.pyi > /tmp/reports/ruff.txt 2>&1; echo $? > /tmp/reports/ruff.status
          ruff format --check "$target" sage-stubs/structure/element.pyi sage-stubs/structure/parent.pyi sage-stubs/rings/polynomial/multi_polynomial_element.pyi > /tmp/reports/ruff-format.txt 2>&1; echo $? > /tmp/reports/ruff-format.status
          python scripts/check_stubs.py sage-stubs/structure/element.pyi sage-stubs/structure/parent.pyi sage-stubs/rings/polynomial/multi_polynomial_element.pyi $(find "$target" -name '*.pyi' -print) > /tmp/reports/check-stubs.txt 2>&1; echo $? > /tmp/reports/check-stubs.status
          python scripts/audit_stub_quality.py --root "$target" --max-console 1000 > /tmp/reports/semantic.txt 2>&1; echo $? > /tmp/reports/semantic.status
          python scripts/stub_coverage.py --subpackage rings/semirings --missing > /tmp/reports/coverage.txt 2>&1; echo $? > /tmp/reports/coverage.status

          ln -s sage-stubs sage
          MYPYPATH=. python -m mypy --strict --no-incremental --follow-imports=silent --show-error-codes --no-pretty sage/rings/semirings > /tmp/reports/mypy.txt 2>&1; echo $? > /tmp/reports/mypy.status
          basedpyright --project pyrightconfig.json sage/rings/semirings --outputjson > /tmp/reports/basedpyright.json; echo $? > /tmp/reports/basedpyright.status
          rm sage

          python - <<'PY2'
          import json
          from pathlib import Path

          reports = Path('/tmp/reports')
          structural = {
              name: int((reports / f'{name}.status').read_text().strip())
              for name in ('ruff', 'ruff-format', 'check-stubs', 'semantic', 'coverage')
          }
          pyright = json.loads((reports / 'basedpyright.json').read_text())
          diagnostics = pyright.get('generalDiagnostics', [])
          allowed_methods = {'roots', 'factor', 'plot'}
          unexpected_pyright = []
          accepted_pyright = []
          for item in diagnostics:
              message = item.get('message', '')
              filename = item.get('file', '')
              method = next((name for name in allowed_methods if f'Method "{name}"' in message), None)
              if filename.endswith('/rings/semirings/tropical_polynomial.pyi') and method and item.get('rule') == 'reportIncompatibleMethodOverride':
                  accepted_pyright.append(item)
              else:
                  unexpected_pyright.append(item)

          mypy_lines = (reports / 'mypy.txt').read_text(errors='replace').splitlines()
          task_mypy = [line for line in mypy_lines if line.startswith('sage/rings/semirings/') and ' error:' in line]
          unexpected_mypy = [
              line for line in task_mypy
              if not (
                  'tropical_polynomial.pyi' in line
                  and any(f'of "{name}"' in line or f'"{name}"' in line for name in allowed_methods)
              )
          ]

          result = {
              **structural,
              'basedpyright_status': int((reports / 'basedpyright.status').read_text().strip()),
              'basedpyright_summary': pyright.get('summary', {}),
              'accepted_source_override_diagnostics': accepted_pyright,
              'unexpected_basedpyright_diagnostics': unexpected_pyright,
              'mypy_status': int((reports / 'mypy.status').read_text().strip()),
              'task_mypy_diagnostics': task_mypy,
              'unexpected_task_mypy_diagnostics': unexpected_mypy,
              'mypy_final': mypy_lines[-1] if mypy_lines else '',
              'coverage_output': (reports / 'coverage.txt').read_text(errors='replace').splitlines(),
              'ruff_output': (reports / 'ruff.txt').read_text(errors='replace').splitlines(),
              'ruff_format_output': (reports / 'ruff-format.txt').read_text(errors='replace').splitlines(),
          }
          Path('/tmp/t04-17-validation.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')

          failed = any(structural.values())
          failed |= pyright.get('summary', {}).get('filesAnalyzed', 0) < 8
          failed |= bool(unexpected_pyright)
          failed |= bool(unexpected_mypy)
          if failed:
              print(Path('/tmp/t04-17-validation.json').read_text())
              raise SystemExit(1)
          print(Path('/tmp/t04-17-validation.json').read_text())
          PY2

      - name: Commit completed task leaf
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add             .agents/phases/phase-04-number-theory-rings.md             sage-stubs/structure/element.pyi             sage-stubs/structure/parent.pyi             sage-stubs/rings/polynomial/multi_polynomial_element.pyi             sage-stubs/rings/semirings
          git commit -m 'feat(stubs): type tropical semirings and varieties'
          git push origin HEAD:t04-17-semirings-final

      - name: Persist validation on operational branch
        if: always()
        run: |
          set -euo pipefail
          test -f /tmp/t04-17-validation.json || echo '{"workflow_failure": true}' > /tmp/t04-17-validation.json
          git fetch origin t04-17-semirings-validation
          git switch -C t04-17-semirings-validation origin/t04-17-semirings-validation
          mkdir -p .agents/validation
          cp /tmp/t04-17-validation.json .agents/validation/t04-17-semirings-final.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/validation/t04-17-semirings-final.json
          git commit -m 'ci: refresh final T04.17 validation'
          git push origin HEAD:t04-17-semirings-validation
