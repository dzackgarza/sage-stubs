name: Finalize corrected Phase 04

on:
  push:
    branches: [phase-04-validation]
    paths:
      - .github/workflows/validate-phase-04-current.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analyzers
        run: python -m pip install --upgrade pip ruff mypy basedpyright

      - name: Validate current main and commit Phase 04 completion
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C phase-04-finalize origin/main

          targets=(
            sage-stubs/rings/finite_rings
            sage-stubs/rings/number_field
            sage-stubs/rings/padics
            sage-stubs/rings/function_field
            sage-stubs/rings/valuation
            sage-stubs/rings/asymptotic
            sage-stubs/rings/semirings
          )

          ruff check "${targets[@]}"
          ruff format --check "${targets[@]}"
          python scripts/check_stubs.py $(find "${targets[@]}" -name '*.pyi' -print)

          cat > /tmp/phase04-pyrightconfig.json <<'JSON'
          {
            "include": [
              "sage-stubs/rings/finite_rings",
              "sage-stubs/rings/number_field",
              "sage-stubs/rings/padics",
              "sage-stubs/rings/function_field",
              "sage-stubs/rings/valuation",
              "sage-stubs/rings/asymptotic",
              "sage-stubs/rings/semirings"
            ],
            "stubPath": "sage-stubs",
            "pythonVersion": "3.12",
            "typeCheckingMode": "strict",
            "reportMissingTypeStubs": false,
            "reportMissingImports": "error"
          }
          JSON
          basedpyright --project /tmp/phase04-pyrightconfig.json --level error

          python -m mypy \
            --strict \
            --no-incremental \
            --follow-imports=silent \
            --show-error-codes \
            "${targets[@]}"

          for directory in "${targets[@]}"; do
            python scripts/audit_stub_quality.py --root "$directory" --max-console 1000
          done

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('.agents/phases/phase-04-number-theory-rings.md')
          text = path.read_text()
          text = text.replace('**Status:** 🟡 In Progress', '**Status:** ✅ Complete')
          text = re.sub(
              r'^(\| T04\.\d+ \|.*?\|) ⬜ (\|.*)$',
              r'\1 ✅ Done \2',
              text,
              flags=re.MULTILINE,
          )
          if '**Status:** ✅ Complete' not in text or ' ⬜ ' in text:
              raise SystemExit('Phase 04 plan was not fully advanced')
          path.write_text(text)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/phases/phase-04-number-theory-rings.md
          git commit -m 'feat(stubs): complete Phase 04 number-theoretic rings'
          git push origin HEAD:main
