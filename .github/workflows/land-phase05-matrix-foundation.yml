name: Land Phase 05 matrix foundation

on:
  push:
    branches: [phase05-matrix-foundation-source-grounded]
    paths:
      - .github/workflows/land-phase05-matrix-foundation.yml

permissions:
  contents: write

jobs:
  land:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Write source-grounded matrix foundation stubs
        shell: bash
        run: |
          set -euo pipefail

          cat > sage-stubs/matrix/matrix0.pyi <<'PYI'
          from collections.abc import Callable, Iterator, Mapping, Sequence
