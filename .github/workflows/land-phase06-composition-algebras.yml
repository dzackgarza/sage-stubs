              def degree(self) -> int: ...
              def half_shuffle(
                  self,
                  other: ShuffleAlgebraElement[_Letter, _Scalar],
                  side: str = ...,
              ) -> Self: ...
              def antipode(self) -> Self: ...


          class ShuffleAlgebra(
              CombinatorialFreeModule,
              Generic[_Letter, _Scalar],
          ):
              Element: type[ShuffleAlgebraElement[_Letter, _Scalar]]
              def __init__(
                  self,
                  base_ring: Parent[_Scalar],
                  alphabet: Sequence[_Letter],
              ) -> None: ...
              def base_ring(self) -> Parent[_Scalar]: ...
              def alphabet(self) -> tuple[_Letter, ...]: ...
              def basis(self) -> AbstractFamily: ...
              def one_basis(self) -> ShuffleWord[_Letter]: ...
              def product_on_basis(
                  self,
                  left: ShuffleWord[_Letter],
                  right: ShuffleWord[_Letter],
              ) -> ShuffleAlgebraElement[_Letter, _Scalar]: ...
              def algebra_generators(self) -> AbstractFamily: ...
              def _element_constructor_(
                  self,
                  x: ShuffleAlgebraElement[_Letter, _Scalar]
                  | Mapping[ShuffleWord[_Letter], ElementConstructorInput]
                  | ElementConstructorInput,
              ) -> ShuffleAlgebraElement[_Letter, _Scalar]: ...
          PYI

          cat > sage-stubs/algebras/free_zinbiel_algebra.pyi <<'PYI'
          from collections.abc import Hashable, Mapping, Sequence
          from typing import Generic, TypeVar

          from sage.combinat.free_module import CombinatorialFreeModule
          from sage.sets.family import AbstractFamily
          from sage.structure.element import RingElement
          from sage.structure.parent import ElementConstructorInput, Parent

          _Letter = TypeVar("_Letter", bound=Hashable, default=Hashable)
          _Scalar = TypeVar("_Scalar", bound=RingElement, default=RingElement)
          type ZinbielWord = tuple[_Letter, ...]


          class FreeZinbielAlgebra(CombinatorialFreeModule, Generic[_Letter, _Scalar]):
              def __init__(
                  self,
                  base_ring: Parent[_Scalar],
                  alphabet: Sequence[_Letter],
              ) -> None: ...
              def base_ring(self) -> Parent[_Scalar]: ...
              def alphabet(self) -> tuple[_Letter, ...]: ...
              def basis(self) -> AbstractFamily: ...
              def one_basis(self) -> ZinbielWord[_Letter]: ...
              def algebra_generators(self) -> AbstractFamily: ...
              def product_on_basis(
                  self,
                  left: ZinbielWord[_Letter],
                  right: ZinbielWord[_Letter],
              ) -> CombinatorialFreeModule.Element: ...
              def _element_constructor_(
                  self,
                  x: Mapping[ZinbielWord[_Letter], ElementConstructorInput]
                  | ElementConstructorInput,
              ) -> CombinatorialFreeModule.Element: ...
          PYI

      - name: Parse changed stubs
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          names = [
              "quaternion_algebra",
              "octonion_algebra",
              "jordan_algebra",
              "tensor_algebra",
              "shuffle_algebra",
              "free_zinbiel_algebra",
          ]
          files = [Path("sage-stubs/algebras") / f"{name}.pyi" for name in names]
          qelt = Path("sage-stubs/algebras/quaternion_algebra_element.pyi")
          if qelt.exists():
              files.append(qelt)
          for path in files:
              ast.parse(path.read_text(), filename=str(path), feature_version=(3, 12))
          PY

      - name: Commit, rebase, and push to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "D. Zack Garza"
          git config user.email "dzackgarza@gmail.com"
          git add sage-stubs/algebras
          git commit --no-verify -m "feat(stubs): type composition and free-construction algebras"
          for attempt in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          exit 1
