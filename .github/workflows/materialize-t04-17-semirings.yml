name: Validate T04.17 semiring stubs

on:
  push:
    branches: [t04-17-semirings-validation]
    paths:
      - .github/workflows/materialize-t04-17-semirings.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: t04-17-semirings-candidate
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install analyzers
        run: python -m pip install --upgrade pip ruff mypy basedpyright

      - name: Validate and record diagnostics
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/reports .agents/validation
          target=sage-stubs/rings/semirings
          ruff check "$target" > /tmp/reports/ruff.txt 2>&1; echo $? > /tmp/reports/ruff.status
          ruff format --check "$target" > /tmp/reports/ruff-format.txt 2>&1; echo $? > /tmp/reports/ruff-format.status
          python scripts/check_stubs.py $(find "$target" -name '*.pyi' -print) > /tmp/reports/check-stubs.txt 2>&1; echo $? > /tmp/reports/check-stubs.status
          python scripts/audit_stub_quality.py --root "$target" --max-console 1000 > /tmp/reports/semantic.txt 2>&1; echo $? > /tmp/reports/semantic.status

          ln -s sage-stubs sage
          MYPYPATH=. python -m mypy --strict --no-incremental --follow-imports=skip --show-error-codes --no-pretty sage/rings/semirings > /tmp/reports/mypy.txt 2>&1; echo $? > /tmp/reports/mypy.status
          rm sage

          basedpyright --project pyrightconfig.json "$target" --outputjson > /tmp/reports/basedpyright.json; echo $? > /tmp/reports/basedpyright.status

          python - <<'PY'
          import json
          from pathlib import Path

          reports = Path('/tmp/reports')
          result = {
              name: int((reports / f'{name}.status').read_text().strip())
              for name in ('ruff', 'ruff-format', 'check-stubs', 'semantic', 'mypy', 'basedpyright')
          }
          pyright = json.loads((reports / 'basedpyright.json').read_text())
          result['basedpyright_summary'] = pyright.get('summary', {})
          result['basedpyright_diagnostics'] = pyright.get('generalDiagnostics', [])[:300]
          mypy_lines = (reports / 'mypy.txt').read_text(errors='replace').splitlines()
          result['mypy_final'] = mypy_lines[-1] if mypy_lines else ''
          result['mypy_diagnostics'] = mypy_lines[:500]
          result['ruff_diagnostics'] = (reports / 'ruff.txt').read_text(errors='replace').splitlines()[:200]
          result['semantic_diagnostics'] = (reports / 'semantic.txt').read_text(errors='replace').splitlines()[:200]
          Path('.agents/validation/t04-17-semirings.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          PY

      - name: Push validation record
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .agents/validation/t04-17-semirings.json
          git commit -m 'ci: refresh T04.17 semiring validation'
          git push origin HEAD:t04-17-semirings-candidate

