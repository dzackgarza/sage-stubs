name: Materialize T04.17 semiring stubs

on:
  push:
    branches: [t04-17-semirings-validation]
    paths:
      - .github/workflows/materialize-t04-17-semirings.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Decode source-grounded semiring patch
        run: |
          set -euo pipefail
          cat > /tmp/t04-17.patch.b64 <<'PATCH'
          
          PATCH
          tr -d '[:space:]' < /tmp/t04-17.patch.b64 | base64 -d > /tmp/t04-17.patch.bz2
          echo '11e010f434dd6594b840e60db0c522adf268cfe1f0a9289d7217b09ce5295039  /tmp/t04-17.patch.bz2' | sha256sum -c -
          bzip2 -dc /tmp/t04-17.patch.bz2 > /tmp/t04-17.patch

      - name: Apply patch to candidate branch
        run: |
          set -euo pipefail
          git fetch origin t04-17-semirings-candidate
          git switch -C t04-17-semirings-candidate origin/t04-17-semirings-candidate
          test "$(git rev-parse HEAD)" = '863e972fd4c5c696d4fe0aa521d0a732c2421d0e'
          git apply --check /tmp/t04-17.patch
          git apply /tmp/t04-17.patch

      - name: Install analyzers
        run: python -m pip install --upgrade pip ruff mypy basedpyright

      - name: Validate semiring task
        run: |
          set +e
          mkdir -p reports
          target=sage-stubs/rings/semirings
          ruff check "$target" > reports/ruff.txt 2>&1; echo $? > reports/ruff.status
          ruff format --check "$target" > reports/ruff-format.txt 2>&1; echo $? > reports/ruff-format.status
          python scripts/check_stubs.py $(find "$target" -name '*.pyi' -print) > reports/check-stubs.txt 2>&1; echo $? > reports/check-stubs.status
          python scripts/audit_stub_quality.py --root "$target" --max-console 1000 > reports/semantic.txt 2>&1; echo $? > reports/semantic.status
          MYPYPATH=sage-stubs python -m mypy --strict --no-incremental --follow-imports=silent --show-error-codes --no-pretty "$target" > reports/mypy.txt 2>&1; echo $? > reports/mypy.status
          cat > semiring-pyrightconfig.json <<'JSON'
          {
            "include": ["sage-stubs/rings/semirings"],
            "stubPath": "sage-stubs",
            "pythonVersion": "3.12",
            "typeCheckingMode": "strict",
            "reportMissingTypeStubs": false,
            "reportMissingImports": "error"
          }
          JSON
          basedpyright --project semiring-pyrightconfig.json --outputjson > reports/basedpyright.json; echo $? > reports/basedpyright.status
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('ruff','ruff-format','check-stubs','semantic','mypy','basedpyright'):
              print(f"{name}: {Path(f'reports/{name}.status').read_text().strip()}")
          report = json.loads(Path('reports/basedpyright.json').read_text())
          print('basedpyright-summary:', report.get('summary'))
          for item in report.get('generalDiagnostics', [])[:100]:
              start = item.get('range', {}).get('start', {})
              print(f"{item.get('file')}:{start.get('line',0)+1}:{start.get('character',0)+1}: {item.get('message')}")
          PY
          exit 0

      - name: Commit candidate task
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sage-stubs/rings/semirings
          git commit -m 'feat(stubs): type tropical semirings and varieties'
          git push origin HEAD:t04-17-semirings-candidate

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: t04-17-semirings-validation
          path: reports
          retention-days: 1
          if-no-files-found: error
