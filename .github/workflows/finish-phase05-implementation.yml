name: Finish Phase 05 implementation

on:
  push:
    branches: [phase04-live-continuation-20260818-2]
    paths:
      - .github/workflows/finish-phase05-implementation.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: write

jobs:
  finish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Await earlier serial work and implement remaining tasks
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          previous=$(curl -fsSL "${headers[@]}" \
            "${api}/actions/workflows/continue-serial-phase05.yml/runs?branch=phase04-live-continuation-20260818-2&per_page=1" \
            | python -c 'import json,sys; print(json.load(sys.stdin)["workflow_runs"][0]["id"])')
          for attempt in $(seq 1 180); do
            previous_state=$(curl -fsSL "${headers[@]}" "${api}/actions/runs/${previous}" \
              | python -c 'import json,sys; r=json.load(sys.stdin); print((r["status"] or "")+":"+(r["conclusion"] or ""))')
            case "$previous_state" in
              completed:success) break ;;
              completed:*) echo "preceding Phase 05 run failed: ${previous_state}"; exit 1 ;;
            esac
            sleep 5
          done
          [[ "$previous_state" == "completed:success" ]]

          unfinished_count() {
            curl -fsSL "${headers[@]}" \
              "${api}/contents/.agents/phases/phase-05-linear-algebra.md?ref=main" \
              | python -c 'import base64,json,sys; t=base64.b64decode(json.load(sys.stdin)["content"]).decode(); print(sum(1 for l in t.splitlines() if l.startswith("| T05.") and ("⬜" in l or "🟡" in l)))'
          }

          for round in $(seq 1 24); do
            remaining=$(unfinished_count)
            [[ "$remaining" -eq 0 ]] && break

            before=$(curl -fsSL "${headers[@]}" \
              "${api}/actions/workflows/implement-next-phase05-task.yml/runs?branch=phase04-live-continuation-20260818-2&per_page=1" \
              | python -c 'import json,sys; d=json.load(sys.stdin); print(d["workflow_runs"][0]["id"] if d["workflow_runs"] else 0)')
            curl --fail-with-body -sS "${headers[@]}" -X POST \
              "${api}/actions/workflows/implement-next-phase05-task.yml/dispatches" \
              -d '{"ref":"phase04-live-continuation-20260818-2"}'

            run_id=""
            for attempt in $(seq 1 40); do
              sleep 4
              run_id=$(curl -fsSL "${headers[@]}" \
                "${api}/actions/workflows/implement-next-phase05-task.yml/runs?branch=phase04-live-continuation-20260818-2&event=workflow_dispatch&per_page=8" \
                | python -c 'import json,sys; before=int(sys.argv[1]); runs=json.load(sys.stdin)["workflow_runs"]; print(next((str(r["id"]) for r in runs if r["id"] != before), ""))' "$before")
              [[ -n "$run_id" ]] && break
            done
            [[ -n "$run_id" ]]

            for attempt in $(seq 1 120); do
              state=$(curl -fsSL "${headers[@]}" "${api}/actions/runs/${run_id}" \
                | python -c 'import json,sys; r=json.load(sys.stdin); print((r["status"] or "")+":"+(r["conclusion"] or ""))')
              case "$state" in
                completed:success) break ;;
                completed:*) echo "Phase 05 implementation stopped at run ${run_id}: ${state}"; exit 1 ;;
              esac
              sleep 5
            done
            [[ "$state" == "completed:success" ]]
          done

          [[ "$(unfinished_count)" -eq 0 ]]

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit Phase 05 completion after all stub tasks
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          card = Path('.agents/phases/phase-05-linear-algebra.md')
          text = card.read_text()
          unfinished = [
              line for line in text.splitlines()
              if line.startswith('| T05.') and ('⬜' in line or '🟡' in line)
          ]
          if unfinished:
              raise SystemExit(f'Unfinished Phase 05 rows: {unfinished}')
          text = text.replace('**Status:** ⬜ Not Started', '**Status:** ✅ Complete', 1)
          text = text.replace('**Status:** 🟡 In Progress', '**Status:** ✅ Complete', 1)
          card.write_text(text)

          plan = Path('.agents/plan.md')
          master = plan.read_text()
          master = master.replace(
              '| 05 | [Linear algebra: matrices & modules](phases/phase-05-linear-algebra.md) | 1 | 01 | ~120 | ⬜ Not Started |',
              '| 05 | [Linear algebra: matrices & modules](phases/phase-05-linear-algebra.md) | 1 | 01 | ~120 | ✅ Complete |',
          )
          master = master.replace(
              '| 05 | [Linear algebra: matrices & modules](phases/phase-05-linear-algebra.md) | 1 | 01 | ~120 | 🟡 In Progress |',
              '| 05 | [Linear algebra: matrices & modules](phases/phase-05-linear-algebra.md) | 1 | 01 | ~120 | ✅ Complete |',
          )
          plan.write_text(master)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/phases/phase-05-linear-algebra.md .agents/plan.md
          git commit -m "plan: complete Phase 05 linear algebra"
          git push origin HEAD:main
