name: Stub quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: stub-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUTF8: "1"

jobs:
  structural:
    name: Ruff and repository guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip ruff
          ruff --version
          mkdir -p reports

      - name: Run Ruff over the complete stub tree
        id: ruff
        continue-on-error: true
        run: |
          set +e
          ruff check --output-format=json sage-stubs/ > reports/ruff.json
          status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          findings = json.loads(Path("reports/ruff.json").read_text())
          print(f"ruff: {len(findings)} finding(s)")
          for item in findings[:100]:
              location = item.get("location", {})
              print(
                  f"{item.get('filename')}:{location.get('row')}:{location.get('column')}: "
                  f"{item.get('code')}: {item.get('message')}"
              )
          if len(findings) > 100:
              print(f"... {len(findings) - 100} additional finding(s); see artifact.")
          PY
          exit "$status"

      - name: Check Ruff formatting over the complete stub tree
        id: ruff_format
        continue-on-error: true
        run: |
          set +e
          ruff format --check sage-stubs/ > reports/ruff-format.txt 2>&1
          status=$?
          set -e
          cat reports/ruff-format.txt
          exit "$status"

      - name: Run AST stub contract checker over the complete tree
        id: check_stubs
        continue-on-error: true
        run: |
          set +e
          python scripts/check_stubs.py > reports/check-stubs.txt 2>&1
          status=$?
          set -e
          sed -n '1,200p' reports/check-stubs.txt
          lines=$(wc -l < reports/check-stubs.txt)
          if (( lines > 200 )); then
            echo "... $((lines - 200)) additional line(s); see artifact."
          fi
          exit "$status"

      - name: Run repository guardrails over the complete tree
        id: guardrails
        continue-on-error: true
        run: |
          set +e
          python scripts/check_guardrails.py --all > reports/guardrails.txt 2>&1
          status=$?
          set -e
          sed -n '1,200p' reports/guardrails.txt
          lines=$(wc -l < reports/guardrails.txt)
          if (( lines > 200 )); then
            echo "... $((lines - 200)) additional line(s); see artifact."
          fi
          exit "$status"

      - name: Parse all repository Python tooling
        id: compile
        continue-on-error: true
        run: |
          python -m compileall -q scripts

      - name: Verify full-tree quality gates remain enabled
        id: quality_config
        continue-on-error: true
        run: python scripts/check_quality_config.py

      - name: Upload structural reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: structural-reports
          path: reports/
          if-no-files-found: error

      - name: Enforce structural result
        if: always()
        env:
          RUFF: ${{ steps.ruff.outcome }}
          RUFF_FORMAT: ${{ steps.ruff_format.outcome }}
          CHECK_STUBS: ${{ steps.check_stubs.outcome }}
          GUARDRAILS: ${{ steps.guardrails.outcome }}
          COMPILE: ${{ steps.compile.outcome }}
          QUALITY_CONFIG: ${{ steps.quality_config.outcome }}
        run: |
          printf 'ruff=%s\nruff_format=%s\ncheck_stubs=%s\nguardrails=%s\ncompile=%s\nquality_config=%s\n' \
            "$RUFF" "$RUFF_FORMAT" "$CHECK_STUBS" "$GUARDRAILS" "$COMPILE" "$QUALITY_CONFIG"
          [[ "$RUFF" == success ]]
          [[ "$RUFF_FORMAT" == success ]]
          [[ "$CHECK_STUBS" == success ]]
          [[ "$GUARDRAILS" == success ]]
          [[ "$COMPILE" == success ]]
          [[ "$QUALITY_CONFIG" == success ]]

  mypy:
    name: Mypy strict, complete tree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install mypy
        run: |
          python -m pip install --upgrade pip mypy
          python -m mypy --version
          mkdir -p reports

      - name: Run strict mypy over every committed stub
        id: mypy
        continue-on-error: true
        run: |
          set +e
          python -m mypy \
            --strict \
            --no-incremental \
            --follow-imports=normal \
            --show-error-codes \
            --show-column-numbers \
            --no-pretty \
            sage-stubs/ > reports/mypy.txt 2>&1
          status=$?
          set -e
          errors=$(grep -c ' error:' reports/mypy.txt || true)
          echo "mypy: ${errors} error line(s)"
          sed -n '1,200p' reports/mypy.txt
          lines=$(wc -l < reports/mypy.txt)
          if (( lines > 200 )); then
            echo "... $((lines - 200)) additional line(s); see artifact."
          fi
          exit "$status"

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mypy-report
          path: reports/mypy.txt
          if-no-files-found: error

      - name: Enforce mypy result
        if: always()
        env:
          OUTCOME: ${{ steps.mypy.outcome }}
        run: test "$OUTCOME" = success

  basedpyright:
    name: Basedpyright strict, complete tree
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install basedpyright
        run: |
          python -m pip install --upgrade pip basedpyright
          basedpyright --version
          mkdir -p reports

      - name: Run basedpyright over every committed stub
        id: basedpyright
        continue-on-error: true
        run: |
          set +e
          basedpyright --project pyrightconfig.json --outputjson \
            > reports/basedpyright.json
          status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/basedpyright.json").read_text())
          summary = report.get("summary", {})
          print(
              "basedpyright: "
              f"{summary.get('errorCount', 0)} error(s), "
              f"{summary.get('warningCount', 0)} warning(s), "
              f"{summary.get('informationCount', 0)} information diagnostic(s)"
          )
          diagnostics = report.get("generalDiagnostics", [])
          for item in diagnostics[:100]:
              start = item.get("range", {}).get("start", {})
              print(
                  f"{item.get('file')}:{start.get('line', 0) + 1}:"
                  f"{start.get('character', 0) + 1}: "
                  f"{item.get('severity')}: {item.get('message')}"
              )
          if len(diagnostics) > 100:
              print(f"... {len(diagnostics) - 100} additional diagnostic(s); see artifact.")
          PY
          exit "$status"

      - name: Upload basedpyright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: basedpyright-report
          path: reports/basedpyright.json
          if-no-files-found: error

      - name: Enforce basedpyright result
        if: always()
        env:
          OUTCOME: ${{ steps.basedpyright.outcome }}
        run: test "$OUTCOME" = success

  semgrep:
    name: Semgrep stub-quality rules
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: |
          python -m pip install --upgrade pip semgrep
          semgrep --version
          mkdir -p reports

      - name: Validate local Semgrep rules
        run: semgrep --validate --config .semgrep/stub-quality.yml

      - name: Run Semgrep over stubs and generators
        id: semgrep
        continue-on-error: true
        run: |
          set +e
          semgrep scan \
            --metrics=off \
            --error \
            --config .semgrep/stub-quality.yml \
            --exclude sage-src \
            --json \
            --output reports/semgrep.json \
            .
          status=$?
          set -e
          semgrep scan \
            --metrics=off \
            --config .semgrep/stub-quality.yml \
            --exclude sage-src \
            --sarif \
            --output reports/semgrep.sarif \
            .
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/semgrep.json").read_text())
          results = report.get("results", [])
          errors = report.get("errors", [])
          print(f"semgrep: {len(results)} finding(s), {len(errors)} engine error(s)")
          for item in results[:100]:
              start = item.get("start", {})
              extra = item.get("extra", {})
              print(
                  f"{item.get('path')}:{start.get('line')}:{start.get('col')}: "
                  f"{item.get('check_id')}: {extra.get('message')}"
              )
          if len(results) > 100:
              print(f"... {len(results) - 100} additional finding(s); see artifact.")
          PY
          exit "$status"

      - name: Upload Semgrep reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-reports
          path: reports/
          if-no-files-found: error

      - name: Enforce Semgrep result
        if: always()
        env:
          OUTCOME: ${{ steps.semgrep.outcome }}
        run: test "$OUTCOME" = success

  semantic-audit:
    name: Semantic type-erasure audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Audit generated and erased type patterns
        id: audit
        continue-on-error: true
        run: |
          mkdir -p reports
          python scripts/audit_stub_quality.py \
            --root sage-stubs \
            --json reports/stub-quality.json \
            --sarif reports/stub-quality.sarif \
            --fail-on warning \
            --max-console 200

      - name: Upload semantic audit reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: semantic-audit-reports
          path: reports/
          if-no-files-found: error

      - name: Enforce semantic audit result
        if: always()
        env:
          OUTCOME: ${{ steps.audit.outcome }}
        run: test "$OUTCOME" = success

  source-parity:
    name: Sage source parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository and pinned Sage source
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Measure module coverage
        id: coverage
        continue-on-error: true
        run: |
          mkdir -p reports
          set +e
          python scripts/stub_coverage.py --json --threshold 1.0 \
            > reports/coverage.json
          status=$?
          set -e
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("reports/coverage.json").read_text())
          total = report["__TOTAL__"]
          print(
              "coverage: "
              f"{total['covered']}/{total['in_scope']} covered; "
              f"{total['missing']} missing; {total['orphan']} orphan"
          )
          PY
          exit "$status"

      - name: Reject orphan stubs
        id: orphan
        continue-on-error: true
        run: |
          python scripts/stub_coverage.py --orphan > reports/orphans.txt
          if [[ -s reports/orphans.txt ]]; then
            cat reports/orphans.txt
            exit 1
          fi

      - name: Upload parity reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-parity-reports
          path: reports/
          if-no-files-found: error

      - name: Enforce source parity result
        if: always()
        env:
          COVERAGE: ${{ steps.coverage.outcome }}
          ORPHAN: ${{ steps.orphan.outcome }}
        run: |
          test "$COVERAGE" = success
          test "$ORPHAN" = success
